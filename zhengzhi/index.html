<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  header .sub { font-size:12px; opacity:.85; }

  .tab { flex-shrink:0; padding:9px 18px; border-radius:20px; border:1px solid rgba(255,255,255,.35);

  .tab.on { background:#fff; color:#b71c1c; border-color:#fff; }
  .panel { display:none; }
  .panel.on { display:block; }
  .card { background:rgba(255,255,255,.14); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.25);

  .q-title { font-size:16px; line-height:1.65; font-weight:600; margin-bottom:14px; }
  .opt { display:block; width:100%; text-align:left; padding:12px 14px; margin-bottom:9px; border-radius:12px;

         font-size:14px; line-height:1.5; cursor:pointer; }

  .opt.right { background:rgba(46,204,113,.45); border-color:#2ecc71; }
  .opt.wrong { background:rgba(231,76,60,.45); border-color:#e74c3c; }
  .opt.lock { pointer-events:none; }
  .analysis { display:none; background:rgba(0,0,0,.22); border-radius:12px; padding:12px 14px;

  .analysis b { color:#ffe082; }
  .btn-row { display:flex; gap:10px; margin-top:14px; }
  .btn { flex:1; padding:12px; border:none; border-radius:12px; font-size:15px; font-weight:600; cursor:pointer; background:#fff; color:#b71c1c; }

  .stat-item { background:rgba(0,0,0,.18); border-radius:12px; padding:12px; text-align:center; }
  .stat-item .num { font-size:22px; font-weight:700; }
  .stat-item .lbl { font-size:11px; opacity:.8; margin-top:2px; }
  .memo h3 { font-size:16px; margin-bottom:8px; color:#ffe082; }
  .memo details { background:rgba(0,0,0,.18); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  .memo summary { font-size:14px; font-weight:600; cursor:pointer; line-height:1.6; }
  .memo .body { font-size:13px; line-height:1.8; margin-top:10px; opacity:.95; }
  .memo .body b { color:#ffe082; }
  .memo .body p { margin-bottom:8px; }
  .qr-box { text-align:center; padding:8px 0; }
  .qr-box .qr-slot { width:180px; height:180px; margin:12px auto; border:2px dashed rgba(255,255,255,.5);

                     font-size:13px; opacity:.8; background:rgba(0,0,0,.15); }

  .qr-box p { font-size:12px; opacity:.85; line-height:1.8; }
  .empty { text-align:center; padding:30px 0; font-size:14px; opacity:.8; }
  .wrong-item { background:rgba(0,0,0,.18); border-radius:12px; padding:12px 14px; margin-bottom:10px; font-size:13px; line-height:1.6; }
  .wrong-item .t { font-weight:600; margin-bottom:4px; }
  .wrong-item .a { color:#a5ffb0; }
  footer { text-align:center; margin-top:20px; font-size:11px; color:rgba(255,255,255,.6); }
</style>

// ===== localStorage =====
var LS_KEY = 'kaoyan_zhengzhi_v1';
var store = { done:{}, wrong:{} };   // done: qid->1; wrong: qid->wrongCount
try { var s = localStorage.getItem(LS_KEY); if (s) store = JSON.parse(s); } catch(e) {}
function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch(e) {} }

var curBlock = 'all';
var order = [], cur = 0;

function qid(q, i) { return q.b + '_' + i; }
function pool() {
  var list = [];
  QS.forEach(function(q, i) { if (curBlock === 'all' || q.b === curBlock) list.push({q:q, i:i}); });
  return list;
}
function buildOrder() {
  var p = pool();
  // 优先没做过的，其次做错的
  var fresh = [], done = [];
  p.forEach(function(item) {
    var id = qid(item.q, item.i);
    if (!store.done[id]) fresh.push(item); else done.push(item);
  });
  order = fresh.concat(done);
  cur = 0;
}

function renderBlockRow() {
  var html = '<div class="bchip' + (curBlock==='all'?' on':'') + '" onclick="setBlock(\'all\')">全部</div>';
  BLOCKS.forEach(function(b) {
    html += '<div class="bchip' + (curBlock===b.id?' on':'') + '" onclick="setBlock(\'' + b.id + '\')">' + b.name + '</div>';
  });
  document.getElementById('blockRow').innerHTML = html;
}
function setBlock(id) { curBlock = id; renderBlockRow(); buildOrder(); showQ(); }

function blockName(id) { for (var i=0;i<BLOCKS.length;i++) if (BLOCKS[i].id===id) return BLOCKS[i].name; return id; }

function showQ() {
  if (!order.length) {
    document.getElementById('qTitle').innerHTML = '本板块题目已刷完 🎉<br><span style="font-size:12px;opacity:.8">点「下一题」从头再来</span>';
    document.getElementById('qOpts').innerHTML = '';
    document.getElementById('qAnalysis').className = 'analysis';
    document.getElementById('qIdx').textContent = '';
    document.getElementById('qBlock').textContent = '';
    return;
  }
  var item = order[cur % order.length];
  var q = item.q, id = qid(q, item.i);
  document.getElementById('qIdx').textContent = '第 ' + (cur % order.length + 1) + ' / ' + order.length + ' 题';
  document.getElementById('qBlock').textContent = blockName(q.b);
  document.getElementById('qTitle').textContent = q.t;
  var opts = '';
  q.o.forEach(function(o, oi) {
    opts += '<button class="opt" data-oi="' + oi + '" onclick="pick(' + oi + ')">' + String.fromCharCode(65+oi) + '. ' + o + '</button>';
  });
  document.getElementById('qOpts').innerHTML = opts;
  document.getElementById('qAnalysis').className = 'analysis';
  document.getElementById('qAnalysis').innerHTML = '<b>解析：</b>' + q.e;
}
function pick(oi) {
  var item = order[cur % order.length];
  var q = item.q, id = qid(q, item.i);
  var btns = document.querySelectorAll('#qOpts .opt');
  btns.forEach(function(b) { b.classList.add('lock'); });
  btns[q.a].classList.add('right');
  if (oi !== q.a) {
    btns[oi].classList.add('wrong');
    store.wrong[id] = (store.wrong[id] || 0) + 1;
  } else {
    delete store.wrong[id];
  }
  store.done[id] = 1;
  save();
  document.getElementById('qAnalysis').className = 'analysis show';
  renderStats();
}
function nextQ() { if (order.length) { cur++; showQ(); } else { buildOrder(); showQ(); } }
function skipQ() { nextQ(); }

function renderStats() {
  var total = QS.length, done = 0, correctIds = 0;
  QS.forEach(function(q, i) {
    var id = qid(q, i);
    if (store.done[id]) done++;
    if (store.done[id] && !store.wrong[id]) correctIds++;
  });
  var rate = done ? Math.round(correctIds / done * 100) : 0;
  var html = '<div class="stat-item"><div class="num">' + done + '/' + total + '</div><div class="lbl">已刷题数</div></div>' +
             '<div class="stat-item"><div class="num">' + rate + '%</div><div class="lbl">正确率</div></div>' +
             '<div class="stat-item"><div class="num">' + Object.keys(store.wrong).length + '</div><div class="lbl">待消灭错题</div></div>' +
             '<div class="stat-item"><div class="num">' + (total - done) + '</div><div class="lbl">剩余新题</div></div>';
  document.getElementById('statGrid').innerHTML = html;
}

function renderMemo() {
  var html = '';
  BLOCKS.forEach(function(b) {
    html += '<div class="card"><h3>' + b.name + ' · ' + b.full + '</h3>';
    MEMO[b.id].forEach(function(m) {
      html += '<details><summary>' + m[0] + '</summary><div class="body">' + m[1] + '</div></details>';
    });
    html += '</div>';
  });
  document.getElementById('memoBody').innerHTML = html;
}

function renderWrong() {
  var ids = Object.keys(store.wrong);
  if (!ids.length) { document.getElementById('wrongList').innerHTML = '<div class="empty">暂无错题，继续保持 💪</div>'; return; }
  var html = '';
  ids.forEach(function(id) {
    var parts = id.split('_'); var bi = parts[0], qi = parseInt(parts[1]);
    QS.forEach(function(q, i) { if (i === qi && q.b === bi) {
      html += '<div class="wrong-item"><div class="t">【' + blockName(q.b) + '】' + q.t + '</div>' +
              '<div>正确答案：<span class="a">' + String.fromCharCode(65+q.a) + '. ' + q.o[q.a] + '</span></div>' +
              '<div style="opacity:.85;margin-top:4px;">' + q.e + '</div></div>';
    }});
  });
  html += '<button class="btn" style="width:100%;" onclick="clearWrong()">全部清零（已掌握）</button>';
  document.getElementById('wrongList').innerHTML = html;
}
function clearWrong() { if (confirm('确认所有错题都已掌握？')) { store.wrong = {}; save(); renderWrong(); renderStats(); } }

// tabs
document.querySelectorAll('.tab').forEach(function(t) {
  t.addEventListener('click', function() {
    document.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('on'); });
    t.classList.add('on');
    document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('on'); });
    document.getElementById(t.dataset.panel).classList.add('on');
    if (t.dataset.panel === 'p-wrong') renderWrong();
  });
});

(function(){
  var img = new Image();
  img.onload = function(){ var s = document.getElementById('qrSlot'); s.innerHTML=''; img.alt='小程序码'; s.appendChild(img); };
  img.src = 'qrcode.png';
})();

renderBlockRow(); buildOrder(); showQ(); renderStats(); renderMemo();
</script>
