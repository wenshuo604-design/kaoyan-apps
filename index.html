<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考研应用集 · 导航</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
         background:linear-gradient(160deg,#667eea,#764ba2); min-height:100vh; padding:36px 16px; }
  header { text-align:center; color:#fff; margin-bottom:28px; }
  .logo { font-size:52px; }
  h1 { font-size:24px; margin:10px 0 6px; letter-spacing:2px; }
  .sub { font-size:13px; opacity:.85; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; max-width:760px; margin:0 auto; }
  .card { display:flex; flex-direction:column; gap:6px; background:rgba(255,255,255,.14);
          backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.25); border-radius:16px;
          padding:18px 14px; text-decoration:none; color:#fff; transition:transform .15s; }
  .card:active { transform:scale(.97); }
  .ico { font-size:30px; }
  .name { font-size:15px; font-weight:600; }
  .desc { font-size:11px; opacity:.75; line-height:1.5; }
  footer { text-align:center; margin-top:28px; font-size:12px; color:rgba(255,255,255,.6); line-height:1.8; }
  @media (min-width:640px){ .grid{ grid-template-columns:repeat(3,1fr); } .card{ padding:22px 16px; } }
  /* 登录遮罩 */
  #gate { position:fixed; inset:0; background:linear-gradient(160deg,#667eea,#764ba2);
          display:flex; align-items:center; justify-content:center; z-index:99; }
  .gate-box { width:min(320px,88vw); background:rgba(255,255,255,.14); backdrop-filter:blur(10px);
              border:1px solid rgba(255,255,255,.3); border-radius:20px; padding:30px 24px; text-align:center; color:#fff; }
  .gate-box h2 { font-size:20px; margin-bottom:6px; }
  .gate-box p { font-size:12px; opacity:.8; margin-bottom:20px; }
  .gate-box input { width:100%; padding:11px 12px; margin-bottom:12px; border-radius:10px; border:none;
                    outline:none; font-size:14px; background:rgba(255,255,255,.92); }
  .gate-box button { width:100%; padding:12px; border:none; border-radius:10px; font-size:15px; font-weight:600;
                     background:#fff; color:#764ba2; cursor:pointer; }
  .gate-box .err { color:#ffd9d9; font-size:12px; min-height:18px; margin-top:10px; }
</style>
</head>
<body>
<header><div class="logo">🦐</div><h1>考研应用集</h1><div class="sub">7 个应用 · 手机浏览器直接打开</div></header>
<main class="grid" id="apps" style="display:none;">
  <a class="card" href="./cuotiben/index.html" target="_blank"><span class="ico">📚</span><span class="name">考研错题本</span><span class="desc">错题录入 · 艾宾浩斯复习打卡</span></a>
  <a class="card" href="./lover-capsule/index.html" target="_blank"><span class="ico">💌</span><span class="name">恋爱时光胶囊</span><span class="desc">甜蜜回忆 · 时光存档</span></a>
  <a class="card" href="./couple-quiz/index.html" target="_blank"><span class="ico">💞</span><span class="name">情侣默契大考验</span><span class="desc">默契测试 · 甜蜜问答</span></a>
  <a class="card" href="./kaoyan-dashboard/index.html" target="_blank"><span class="ico">🎯</span><span class="name">考研总控台</span><span class="desc">学习工作台 · 数据总览</span></a>
  <a class="card" href="./apology-app/index.html" target="_blank"><span class="ico">🌹</span><span class="name">哄女友神器</span><span class="desc">道歉 · 哄人 · 惊喜</span></a>
  <a class="card" href="./webpage-kaoyan-major/index.html" target="_blank"><span class="ico">📘</span><span class="name">专业课刷题小程序</span><span class="desc">机械原理 · 液压传动 · 刷题</span></a>
  <a class="card" href="./gaoshu2/index.html" target="_blank"><span class="ico">📈</span><span class="name">高数二复盘助手</span><span class="desc">知识点复盘 · 知识包</span></a>
</main>
<footer id="ft" style="display:none;">数据保存在你的手机浏览器本地 · 欢迎使用</footer>

<!-- 账号密码门（纯前端验证：防陌生人浏览，数据本身在各自应用内） -->
<div id="gate">
  <div class="gate-box">
    <h2>🔐 专属入口</h2>
    <p>请输入账号密码进入</p>
    <input id="g-account" type="text" placeholder="账号" autocomplete="off">
    <input id="g-pass" type="password" placeholder="密码">
    <button onclick="tryLogin()">进入</button>
    <div class="err" id="g-err"></div>
  </div>
</div>
<script>
// ===== 修改这里的账号密码 =====
var PASS_ACCOUNT = 'kaoyan';
var PASS_PASSWORD = '5201314';
// ==============================
function tryLogin() {
  var a = document.getElementById('g-account').value.trim();
  var p = document.getElementById('g-pass').value;
  var err = document.getElementById('g-err');
  if (a === PASS_ACCOUNT && p === PASS_PASSWORD) {
    sessionStorage.setItem('auth_ok', '1');
    document.getElementById('gate').style.display = 'none';
    document.getElementById('apps').style.display = 'grid';
    document.getElementById('ft').style.display = 'block';
  } else {
    err.textContent = '账号或密码不对哦';
  }
}
(function () {
  if (sessionStorage.getItem('auth_ok') === '1') {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('apps').style.display = 'grid';
    document.getElementById('ft').style.display = 'block';
  }
})();
</script>
</body>
</html>
