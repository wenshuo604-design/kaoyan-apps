<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a6dff">
<title>山东科技大学 810 机械综合刷题 · 机械原理 + 液压传动</title>
<style>
:root{
  --bg:#f2f5fb; --card:#ffffff; --line:#e6eaf3;
  --txt:#1c2333; --mut:#7a8499;
  --ok:#16a34a; --okbg:#e7f6ec; --bad:#e5484d; --badbg:#fdecec;
  --blue:#1a6dff; --bluebg:#e8f0ff;
  --orange:#f59e0b; --orangebg:#fdf3e0;
  --shadow:0 2px 10px rgba(28,35,51,.06);
  --r:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  background:var(--bg);color:var(--txt);font-size:15px;line-height:1.6;
}
.wrap{max-width:560px;margin:0 auto;min-height:100%;position:relative;padding-bottom:76px}
/* 顶栏 */
.topbar{
  position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;height:52px;padding:0 10px;gap:6px;
}
.topbar .back{width:36px;height:36px;border:none;background:none;font-size:26px;color:var(--txt);line-height:1;cursor:pointer;border-radius:10px}
.topbar .back:hover{background:var(--bg)}
.topbar .ttl{flex:1;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sub{font-size:12px;color:var(--mut);font-weight:400;margin-left:8px}
/* 底部导航 */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:50;background:#fff;border-top:1px solid var(--line);
  display:flex;max-width:560px;margin:0 auto;
}
.tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0 10px;color:var(--mut);cursor:pointer;font-size:11px;gap:2px}
.tabbar .tab .ic{font-size:20px;line-height:1}
.tabbar .tab.on{color:var(--blue);font-weight:600}
/* 通用 */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin:12px;padding:16px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;cursor:pointer;
  border-radius:12px;padding:11px 18px;font-size:15px;font-weight:600;color:#fff;background:var(--blue);
  transition:opacity .15s;width:100%;
}
.btn:active{opacity:.8}
.btn.ghost{background:var(--bluebg);color:var(--blue)}
.btn.ok{background:var(--ok)}
.btn.warn{background:var(--orange)}
.btn.gray{background:#eef1f7;color:var(--txt)}
.btn.sm{width:auto;padding:7px 14px;font-size:13px;border-radius:10px}
.row{display:flex;gap:10px}
.row .btn{flex:1}
h2.sec{font-size:15px;color:var(--mut);margin:18px 12px 4px;font-weight:600}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:20px;font-weight:600}
.pill.blue{background:var(--bluebg);color:var(--blue)}
.pill.orange{background:var(--orangebg);color:#b45309}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.bad{background:var(--badbg);color:var(--bad)}
.pill.gray{background:#eef1f7;color:var(--mut)}
/* 首页 */
.hero{
  margin:14px 12px 4px;border-radius:18px;padding:20px 18px;color:#fff;
  background:linear-gradient(135deg,#1a6dff,#4f9bff);
}
.hero .hi{font-size:13px;opacity:.9}
.hero .big{font-size:24px;font-weight:800;margin:4px 0 2px}
.hero .cnt{font-size:13px;opacity:.92}
.hero .bar{height:7px;background:rgba(255,255,255,.28);border-radius:10px;margin-top:12px;overflow:hidden}
.hero .bar i{display:block;height:100%;background:#fff;border-radius:10px;transition:width .4s}
.course-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin:12px;padding:16px;cursor:pointer;position:relative;overflow:hidden}
.course-card .top{display:flex;align-items:center;gap:12px}
.course-card .logo{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.course-card .nm{font-size:17px;font-weight:700}
.course-card .au{font-size:12px;color:var(--mut)}
.course-card .meta{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.course-card .go{margin-left:auto;color:#c3c9d8;font-size:22px}
/* 章节列表 */
.ch-item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin:10px 12px;padding:14px;cursor:pointer}
.ch-item .no{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none}
.ch-item .info{flex:1;min-width:0}
.ch-item .nm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-item .st{font-size:12px;color:var(--mut);margin-top:3px}
.ch-item .pbar{height:5px;background:#eef1f7;border-radius:8px;margin-top:6px;overflow:hidden}
.ch-item .pbar i{display:block;height:100%;border-radius:8px;transition:width .3s}
.ch-item .arrow{color:#c3c9d8}
/* 知识点 */
.pt{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin:10px 12px;padding:14px 16px}
.pt .hd{display:flex;align-items:flex-start;gap:8px}
.pt .tag{flex:none;font-size:12px;background:var(--bluebg);color:var(--blue);padding:2px 9px;border-radius:8px;font-weight:600;margin-top:2px}
.pt .t{font-weight:700;font-size:15px;flex:1}
.pt .fav{flex:none;border:none;background:none;font-size:18px;cursor:pointer;padding:2px;color:#d5dae6}
.pt .fav.on{color:#f59e0b}
.pt .d{font-size:14px;color:#3d4660;margin-top:10px}
.pt .d p{margin:5px 0}
.pt .d .k{color:var(--blue);font-weight:700}
.pt .d .f{display:block;background:#f6f8fd;border-left:3px solid var(--blue);border-radius:6px;padding:6px 10px;margin:6px 0;font-family:"Cambria Math",Georgia,serif;font-size:14.5px}
/* 公式 */
.fm{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin:10px 12px;padding:12px 16px;display:flex;gap:12px;align-items:center}
.fm .nm{flex:1;font-size:14px;color:#3d4660}
.fm .f{font-family:"Cambria Math",Georgia,serif;font-size:16px;font-weight:700;color:var(--blue);white-space:nowrap}
/* 答题 */
.qz{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin:12px;padding:18px 16px}
.qz .prog{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.qz .prog .pbar{flex:1;height:6px;background:#eef1f7;border-radius:8px;overflow:hidden}
.qz .prog .pbar i{display:block;height:100%;background:var(--blue);border-radius:8px;transition:width .3s}
.qz .prog .num{font-size:12px;color:var(--mut);white-space:nowrap}
.qz .stem{font-size:16px;font-weight:700;margin-bottom:14px}
.opt{
  display:flex;align-items:flex-start;gap:10px;border:1.5px solid var(--line);border-radius:12px;
  padding:11px 12px;margin:9px 0;cursor:pointer;transition:all .15s;background:#fff;
}
.opt .ol{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid #c9d1e3;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--mut);font-weight:600}
.opt .ot{flex:1;font-size:14.5px;color:#2a3350}
.opt.sel{border-color:var(--blue);background:var(--bluebg)}
.opt.sel .ol{border-color:var(--blue);background:var(--blue);color:#fff}
.opt.cor{border-color:var(--ok);background:var(--okbg)}
.opt.cor .ol{border-color:var(--ok);background:var(--ok);color:#fff}
.opt.wro{border-color:var(--bad);background:var(--badbg)}
.opt.wro .ol{border-color:var(--bad);background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.exp{border-radius:12px;padding:12px 14px;margin-top:12px;font-size:14px}
.exp.ok{background:var(--okbg);color:#14532d}
.exp.bad{background:var(--badbg);color:#7f1d1d}
.exp .tt{font-weight:700;margin-bottom:4px}
/* 结果 */
.res-card{text-align:center;padding:26px 18px}
.res-card .score{font-size:46px;font-weight:800}
.res-card .score small{font-size:16px;color:var(--mut);font-weight:400}
.res-card .ring{width:110px;height:110px;border-radius:50%;margin:14px auto;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#fff}
/* 错题/收藏列表 */
.wi{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin:10px 12px;padding:14px 16px}
.wi .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.wi .q{font-size:14.5px;font-weight:600;color:#2a3350}
.wi .ans{font-size:13.5px;margin-top:8px;padding:8px 10px;border-radius:8px;background:#f6f8fd}
.wi .ans b{color:var(--ok)}
.wi .ops{margin-top:10px;display:flex;gap:8px}
/* 统计 */
.stat-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin:10px 12px;padding:16px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:4px}
.stat-grid .it{text-align:center;padding:10px 4px;border-radius:12px;background:#f6f8fd}
.stat-grid .it .v{font-size:20px;font-weight:800}
.stat-grid .it .l{font-size:12px;color:var(--mut)}
.course-row{display:flex;align-items:center;gap:10px;margin:9px 0}
.course-row .nm{width:88px;font-size:13px;color:#3d4660;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.course-row .pbar{flex:1;height:8px;background:#eef1f7;border-radius:8px;overflow:hidden}
.course-row .pbar i{display:block;height:100%;border-radius:8px;transition:width .3s}
.course-row .v{width:52px;text-align:right;font-size:12px;color:var(--mut);flex:none}
.empty{text-align:center;color:var(--mut);padding:50px 20px;font-size:14px}
.empty .ic{font-size:44px;display:block;margin-bottom:10px}
/* 通用提示 */
.tip{font-size:12px;color:var(--mut);text-align:center;margin:6px 12px}
a{color:var(--blue);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <button class="back" id="backBtn" style="visibility:hidden">‹</button>
    <div class="ttl" id="topTitle">考研专业课</div>
    <div class="sub" id="topSub"></div>
  </header>
  <main id="app"></main>
</div>
<nav class="tabbar">
  <div class="tab" data-tab="home"><span class="ic">🏠</span><span>首页</span></div>
  <div class="tab" data-tab="wrong"><span class="ic">📕</span><span>错题本</span></div>
  <div class="tab" data-tab="fav"><span class="ic">⭐</span><span>收藏</span></div>
  <div class="tab" data-tab="stats"><span class="ic">📊</span><span>统计</span></div>
</nav>
<script>
/* ================= 题库数据 ================= */
const COURSES = {
hyd:{
  id:"hyd", name:"液压传动", author:"王积伟", icon:"💧", color:"#1a6dff", bg:"var(--bluebg)",
  desc:"810 机械综合指定教材（考纲占 75 分，4-5 道大题）。以液压油为工作介质，通过压力能传递动力。重点：泵与马达综合计算、压力分析、调速回路。",
  chapters:[
  {id:"h1", name:"第1章 液压传动概述", points:[
    {t:"传动原理与帕斯卡原理", d:"<p>液压传动以<b>液体</b>为工作介质，依靠密闭容积内的<b>压力能</b>传递运动和动力（属于容积式传动）。</p><p><span class='k'>帕斯卡原理</span>：密闭容器内的静止液体，外加压力可以等值地传递到液体各点。</p><p>液体几乎不可压缩，这是液压传动能够传递力的基础。</p>"},
    {t:"液压系统的组成", d:"<p>液压系统由五部分组成：</p><p>① <span class='k'>动力元件</span>——液压泵（机械能→液压能）；② <span class='k'>执行元件</span>——液压缸、液压马达（液压能→机械能）；③ <span class='k'>控制元件</span>——方向阀、压力阀、流量阀；④ <span class='k'>辅助元件</span>——油箱、滤油器、蓄能器、管路、密封件等；⑤ <span class='k'>工作介质</span>——液压油。</p>"},
    {t:"两个基本参数：压力与流量", d:"<p><span class='k'>压力 p</span> 由<b>外负载</b>决定（p=F/A），泵的额定压力只是能力上限；<span class='k'>流量 q</span> 由泵或流量阀决定。</p><p>执行元件：<span class='f'>F = pA（力由压力决定）　v = q/A（速度由流量决定）</span></p><p>一句话：<b>压力取决于负载，速度取决于流量</b>——考研高频判断题。</p>"},
    {t:"液压传动的优缺点", d:"<p><span class='k'>优点</span>：功率密度大（体积小重量轻）、易于无级调速、易于实现过载保护与自动化、元件布局灵活、自润滑。</p><p><span class='k'>缺点</span>：效率较低（泄漏+摩擦损失）、对油温敏感、易泄漏污染环境、故障不易排查、制造精度要求高。</p>"},
    {t:"液压系统图与图形符号", d:"<p>液压系统图用<b>图形符号</b>表示，符号只反映元件的<b>功能与连接关系</b>，不反映具体结构和尺寸。</p><p><span class='k'>阅读顺序</span>：<b>执行元件 → 控制阀 → 泵源</b>，结合工况（快进、工进、快退）逐段分析油路走向。</p>"}
  ], quiz:[
    {q:"液压传动系统中，工作压力的大小取决于（ ）。", opts:["液压泵的额定压力","外负载","液压油的黏度","执行元件的运动速度"], a:1, exp:"压力由外负载决定（p=F/A），液压泵的额定压力只是其能力的上限，不代表系统实际压力。"},
    {q:"液压传动中，执行元件运动速度的大小取决于（ ）。", opts:["工作压力","外负载","进入执行元件的流量","油液温度"], a:2, exp:"v=q/A，速度由进入执行元件的流量决定，与压力大小无直接关系。"},
    {q:"将机械能转换为液压能的元件是（ ）。", opts:["液压缸","液压泵","液压马达","换向阀"], a:1, exp:"液压泵是动力元件，把原动机的机械能转换成液体的压力能。"},
    {q:"液压系统不包括以下哪类元件（ ）。", opts:["动力元件","执行元件","控制元件","传感放大元件"], a:3, exp:"系统由动力、执行、控制、辅助元件及工作介质组成，没有单独的传感放大元件。"},
    {q:"判断题：液压传动易于实现过载保护，且能方便地实现无级调速。", opts:["正确","错误"], a:0, exp:"两者都是液压传动的主要优点：压力阀可限压过载保护，流量控制可实现无级调速。"},
    {q:"液压传动的缺点不包括（ ）。", opts:["效率较低","对温度敏感","易于远距离传输","故障不易排查"], a:2, exp:"液压传动不能远距离传输：管路越长，压力损失和泄漏越严重，这是液压传动的突出局限。"},
    {q:"判断题：与电力传动相比，液压传动惯性小、响应速度快，适合高频伺服控制。", opts:["正确","错误"], a:0, exp:"液压元件功率密度大、时间常数小，动作响应快，在伺服控制中优势明显。"}
  ], calc:[
    {q:"简述液压传动系统的组成，并说明各组成部分的作用。", tag:"简答", ans:"液压传动系统由五部分组成：\n① 动力元件——液压泵：将原动机的机械能转换为液体的压力能；\n② 执行元件——液压缸、液压马达：将液体的压力能转换为机械能（直线运动或回转运动）；\n③ 控制元件——方向阀、压力阀、流量阀：控制和调节液流的流动方向、压力高低和流量大小；\n④ 辅助元件——油箱、滤油器、蓄能器、管路、密封件等：保障系统正常工作；\n⑤ 工作介质——液压油：传递能量，兼起润滑、冷却、防锈作用。", exp:"答题框架：五部分名称＋各自功能，重点是区分动力元件（泵，机械能→液压能）与执行元件（缸/马达，液压能→机械能）。控制元件按方向、压力、流量三类阀作答更完整。"}
  ]},
  {id:"h2", name:"第2章 液压油与流体力学基础", points:[
    {t:"黏度及黏温、黏压特性", d:"<p><span class='k'>动力黏度</span> μ（Pa·s）与 <span class='k'>运动黏度</span> ν 的关系：<span class='f'>ν = μ / ρ</span></p><p>黏度是选择液压油<b>最重要</b>的指标：黏度过大→压力损失大、发热；黏度过小→泄漏大、润滑差。</p><p><span class='k'>黏温特性</span>：温度升高，黏度<b>降低</b>；<span class='k'>黏压特性</span>：压力升高，黏度略有<b>增大</b>。</p>"},
    {t:"液压油牌号的含义", d:"<p>牌号如 L-HL32、L-HM46、L-HV68 等，<b>数字表示该油在 40℃ 时的运动黏度值（mm²/s）</b>。</p><p>例如 L-HM46 表示 40℃ 时运动黏度约为 46 mm²/s 的抗磨液压油。</p>"},
    {t:"连续性方程（质量守恒）", d:"<p>不可压缩流体在管道内稳定流动时，流量守恒：<span class='f'>q = A₁v₁ = A₂v₂</span></p><p>即<b>流速与截面积成反比</b>：管道越细，流速越大。</p>"},
    {t:"伯努利方程（能量守恒）", d:"<p>理想液体稳定流动时：<span class='f'>p₁/ρg + z₁ + v₁²/2g = p₂/ρg + z₂ + v₂²/2g</span></p><p>三项分别表示<b>压力头 + 位置头 + 速度头</b>，总和守恒；实际液体需加上损失项 hw。</p><p>应用：速度高→压力低（如虹吸、阀口节流产生压差）。</p>"},
    {t:"压力损失与泄漏", d:"<p><span class='k'>沿程损失</span>：液体沿等径直管流动的摩擦损失，与管长、黏度、流速成正比，与管径成反比。</p><p><span class='k'>局部损失</span>：流经阀口、弯头、突然扩大/收缩处产生的损失。</p><p>泄漏造成<b>流量损失</b>，是液压系统效率较低的主要原因。</p>"},
    {t:"层流与紊流（雷诺数）", d:"<p><span class='f'>Re = vd/ν</span>（v—流速，d—管径，ν—运动黏度）</p><p>圆管临界雷诺数 <span class='k'>Recr ≈ 2320</span>：Re&lt;Recr 为<b>层流</b>（沿程损失与流速一次方成正比），Re&gt;Recr 为<b>紊流</b>（损失与流速 1.75~2 次方成正比）。液压管道中多为层流。</p>"},
    {t:"孔口流量特性", d:"<p><span class='k'>薄壁小孔</span>（l/d≤0.5）：<span class='f'>q = Cd·A·√(2Δp/ρ)</span>——流量与<b>√Δp</b>成正比、<b>几乎不受黏度影响</b>，节流口应尽量采用薄壁孔。</p><p><span class='k'>细长孔</span>（l/d&gt;4）：流量与 Δp/μ 成正比，<b>受黏度影响大</b>（温度敏感，常用作阻尼孔）。</p>"},
    {t:"气穴现象与液压冲击", d:"<p><span class='k'>气穴现象</span>：局部压力低于空气分离压时，溶解空气析出形成气泡；气泡流到高压区迅速破裂，产生局部高温高压冲击，剥蚀金属表面（<b>气蚀</b>），伴随噪声与振动。预防：降低吸油高度、加大吸油管径。</p><p><span class='k'>液压冲击</span>：阀门突然启闭或换向引起管路压力急剧升高（水锤效应）。缓解：延长换向（启闭）时间、管路装蓄能器。</p>"}
  ], quiz:[
    {q:"运动黏度 ν 与动力黏度 μ 的关系为（ ）。", opts:["ν=μ·ρ","ν=μ/ρ","ν=ρ/μ","ν=μ+ρ"], a:1, exp:"ν=μ/ρ，动力黏度除以密度得到运动黏度。"},
    {q:"液压油黏度随温度升高而（ ）。", opts:["增大","减小","不变","先增大后减小"], a:1, exp:"黏温特性：温度升高，油液分子间作用减弱，黏度降低。"},
    {q:"液压油牌号 L-HM46 中“46”表示（ ）。", opts:["黏度指数","40℃时的运动黏度约为46mm²/s","密度值","闪点值"], a:1, exp:"牌号中的数字代表40℃时的运动黏度（mm²/s）。"},
    {q:"连续性方程 q=A₁v₁=A₂v₂ 是（ ）定律在流体流动中的体现。", opts:["能量守恒","动量守恒","质量守恒","万有引力"], a:2, exp:"连续性方程由质量守恒定律导出：不可压缩流体流量处处相等。"},
    {q:"判断题：液体在等直径直管中流动时，沿程压力损失随管长增加而增大。", opts:["正确","错误"], a:0, exp:"沿程损失 Δp=λ·(l/d)·(ρv²/2)，与管长 l 成正比。"},
    {q:"判别液体流动状态（层流/紊流）的依据是（ ）。", opts:["流速","雷诺数","压力","黏度"], a:1, exp:"Re=vd/ν，Re 小于 2320 为层流，Re 大于 2320 为紊流。"},
    {q:"节流口应优先选用（ ），使流量受温度影响小。", opts:["细长孔","薄壁小孔","阻尼孔","毛细管"], a:1, exp:"薄壁小孔流量与黏度几乎无关，温度变化对流量影响小；细长孔流量与黏度成反比，受温度影响大。"},
    {q:"判断题：气穴现象中气泡破裂会引起噪声、振动，严重时产生气蚀损坏元件。", opts:["正确","错误"], a:0, exp:"气泡在高压区破裂产生局部高温高压冲击，剥蚀金属表面，即气蚀。"}
  ], calc:[
    {q:"某液压泵从油箱吸油，吸油管直径 d=32mm，流量 q=63L/min，油液密度 ρ=900kg/m³，吸油高度 h=0.5m，吸油管路沿程与局部损失合计 Δp损=0.02MPa。求：①吸油管内流速 v；②泵吸油口处的绝对压力 p₁（大气压 p₀=0.1MPa，忽略液面速度）。", tag:"连续性方程+伯努利方程", ans:"① 管道截面积 A=πd²/4=π×0.032²/4=8.04×10⁻⁴m²；v=q/A=(63×10⁻³/60)/8.04×10⁻⁴≈1.31m/s。\n② 取油箱液面为 0-0 面、泵吸油口为 1-1 面列伯努利方程：p₀/ρg+v₀²/2g=p₁/ρg+h+v₁²/2g+Δp损/ρg，其中 v₀≈0。\np₁=p₀−ρg(h+v₁²/2g)−Δp损=0.1×10⁶−900×9.8×(0.5+1.31²/19.6)−0.02×10⁶≈100000−5202−20000≈74800Pa≈0.075MPa（低于大气压）。", exp:"① 先用连续性方程 q=Av 求流速；② 对液面与吸油口列伯努利方程，吸油口高于液面时位置头取正、损失项为负；③ 结果 p₁＜p₀ 说明吸油口呈真空，这正是泵能吸油（大气压把油压入泵）的原因；④ 若真空度太大（吸油高度过高、管径过细）会引发气穴现象，故吸油管宜粗、短、直。"},
    {q:"某液压油在直径 d=20mm 的管道内流动，运动黏度 ν=20mm²/s。求：①当流速 v=1.2m/s 时的雷诺数 Re 并判断流态；②该管道由层流转变为紊流的临界流速 vcr（取 Recr=2320）；③若流速增至 3m/s，流动状态如何？", tag:"雷诺数与流态判断", ans:"① Re=vd/ν=1.2×0.02/(20×10⁻⁶)=0.024/(2×10⁻⁵)=1200＜2320，为层流。\n② vcr=Recr·ν/d=2320×20×10⁻⁶/0.02=2.32m/s。\n③ v=3m/s＞vcr=2.32m/s，为紊流。", exp:"雷诺数 Re=vd/ν 是流态判据：Re＜2320 层流（沿程损失∝v¹），Re＞2320 紊流（损失∝v¹·⁷⁵~v²）。临界流速 vcr=Recr·ν/d 与黏度成正比、与管径成反比——油温低黏度大时更不易出现紊流。液压系统管道流速一般取 1~5m/s，吸油管偏低、压油管可偏高。"}
  ]},
  {id:"h3", name:"第3章 液压泵", points:[
    {t:"容积式泵的工作原理", d:"<p>液压泵都是<b>容积式泵</b>：依靠<b>密封容积的周期性变化</b>吸油和压油。</p><p>正常工作必要条件：① 密封容积能周期性变化；② 吸油腔与压油腔必须<b>隔开</b>（配流）。</p><p>泵输出的是<b>流量</b>，压力由负载决定（泵的出口压力随负载升高而升高，受额定压力限制）。</p>"},
    {t:"主要性能参数", d:"<p><span class='k'>排量 V</span>：泵每转一周排出液体的体积（m³/r）；<span class='k'>理论流量</span>：<span class='f'>qₜ = V·n</span></p><p>实际流量 q = qₜ − Δq（泄漏）。效率关系：<span class='f'>ηv = q/qₜ　η = ηv·ηm</span></p><p>输出功率 P = pq；输入功率 Pᵢ = T·ω = 2πnT。</p>"},
    {t:"齿轮泵", d:"<p><span class='k'>优点</span>：结构简单、价格低、自吸性好、对油液污染不敏感。</p><p><span class='k'>缺点</span>：① <b>困油现象</b>——齿间密封容积在啮合过程中先缩小后增大，产生压力冲击与气蚀，通常在端盖开<b>卸荷槽</b>解决；② <b>径向液压力不平衡</b>——高压腔与低压腔压差使轴承偏载；③ 流量脉动大、噪声大。</p>"},
    {t:"叶片泵", d:"<p><span class='k'>单作用叶片泵</span>：定子内表面是圆，转子偏心安装，每转吸、压油各一次；改变<b>偏心距 e</b> 可变量，但<b>径向力不平衡</b>。</p><p><span class='k'>双作用叶片泵</span>：定子内表面是椭圆曲线，每转吸、压油各<b>两次</b>，属<b>定量泵</b>，<b>径向力平衡</b>，应用最广。</p>"},
    {t:"柱塞泵", d:"<p><span class='k'>轴向柱塞泵</span>：柱塞平行于传动轴布置，靠<b>斜盘倾角 γ</b> 实现吸压油，改变 γ 即可<b>变量</b>；压力高、效率高、变量方便，用于高压大流量系统。</p><p><span class='k'>径向柱塞泵</span>：柱塞沿径向布置，靠偏心环变量。</p><p>柱塞泵是三种泵中性能最好的，但结构最复杂、价格最高、对油液清洁度要求高。</p>"},
    {t:"三种泵的综合比较", d:"<p><span class='k'>齿轮泵</span>：结构简单、价格低、自吸好、抗污染强，但流量脉动大、压力较低，有困油和径向力不平衡。</p><p><span class='k'>叶片泵</span>：流量脉动小、运转平稳、噪声小，中压场合应用广。</p><p><span class='k'>柱塞泵</span>：压力最高（可达35MPa以上）、效率高、易变量，但结构复杂、价格高、对油液清洁度要求严，用于高压大流量系统。</p>"}
  ], quiz:[
    {q:"液压泵的理论流量为（ ）。", opts:["q=Vn·ηv","qₜ=Vn","q=Vn/ηv","qₜ=pV"], a:1, exp:"理论流量=排量×转速，即 qₜ=Vn；实际流量还要乘以容积效率。"},
    {q:"容积式液压泵正常工作的必要条件是（ ）。", opts:["转速足够高","密封容积周期性变化且吸压油腔隔开","油温恒定","输出压力足够大"], a:1, exp:"这是容积式泵工作的两个基本条件，缺一不可。"},
    {q:"双作用叶片泵每转一周，每个密封容积吸、压油各（ ）次。", opts:["1","2","3","4"], a:1, exp:"双作用叶片泵定子内表面为椭圆，每转吸压油各两次，故为定量泵。"},
    {q:"齿轮泵的“困油现象”通常通过（ ）来解决。", opts:["增大模数","在端盖上开卸荷槽","提高转速","增大齿数"], a:1, exp:"在齿轮泵端盖上开设卸荷槽，使困油容积与吸压油腔适时沟通。"},
    {q:"轴向柱塞泵改变排量的方法是改变（ ）。", opts:["转速","斜盘倾角","柱塞直径","油液黏度"], a:1, exp:"轴向柱塞泵靠斜盘倾角 γ 控制柱塞行程，改变 γ 即改变排量，实现变量。"},
    {q:"泵的总效率 η 与容积效率 ηv、机械效率 ηm 的关系为（ ）。", opts:["η=ηv+ηm","η=ηv−ηm","η=ηv·ηm","η=ηv/ηm"], a:2, exp:"总效率=容积效率×机械效率，这是常考公式。"},
    {q:"轴向柱塞泵的主要优点是（ ）。", opts:["结构简单、价格低","压力高、效率高、便于变量","自吸能力强","抗污染能力强"], a:1, exp:"柱塞泵压力最高、效率高，改变斜盘倾角即可变量，是三种泵中性能最好的。"},
    {q:"判断题：齿轮泵自吸能力强、对油液污染不敏感，但存在困油现象和径向液压力不平衡的问题。", opts:["正确","错误"], a:0, exp:"齿轮泵结构简单、间隙较大，抗污染和自吸性能好；困油和径向力不平衡是其固有缺陷。"},
    {q:"液压泵的额定压力是指（ ）。", opts:["泵实际工作时的压力","按试验标准规定能连续运转的最高压力","允许的最高冲击压力","泵的出口压力"], a:1, exp:"额定压力是泵长期连续运转允许的最高压力；实际工作压力由负载决定，可低于额定压力。"}
  ], calc:[
    {q:"某齿轮泵排量 V=40mL/r，转速 n=1450r/min，容积效率 ηv=0.92，机械效率 ηm=0.90，输出压力 p=10MPa。求：①理论流量 qₜ；②实际流量 q；③泵的输出功率 P₀；④泵的输入功率 Pᵢ；⑤总效率 η。", tag:"泵的参数计算", ans:"① qₜ=Vn=40×10⁻⁶×1450=0.058m³/min=58L/min。\n② q=qₜ·ηv=58×0.92=53.4L/min。\n③ P₀=pq=10×10⁶×(53.4×10⁻³/60)≈8.9×10³W=8.9kW。\n④ η=ηv·ηm=0.92×0.90=0.828；Pᵢ=P₀/η=8.9/0.828≈10.7kW。", exp:"经典四问：理论流量=排量×转速；实际流量=理论流量×容积效率；输出功率=pq（q 用实际流量，注意单位换算成 m³/s）；输入功率=输出功率÷总效率，总效率=容积效率×机械效率。"},
    {q:"某轴向柱塞泵，斜盘倾角 γ=15°，柱塞数 z=7，柱塞直径 d=12mm，柱塞分布圆直径 D=65mm，转速 n=1500r/min。求：①该泵的排量 V；②理论流量 qₜ；③若输出压力 p=20MPa、总效率 η=0.85，求输入功率 Pᵢ。", tag:"柱塞泵排量计算", ans:"① 柱塞行程 h=D·tanγ=65×tan15°=65×0.268=17.4mm；排量 V=z·(πd²/4)·h=7×(π×0.012²/4)×0.0174=7×1.131×10⁻⁴×0.0174≈1.378×10⁻⁵m³/r≈13.8mL/r。\n② qₜ=Vn=13.8×10⁻³×1500=20.7L/min。\n③ 输出功率 P₀=p·qₜ=20×10⁶×(20.7×10⁻³/60)≈6.9kW；Pᵢ=P₀/η=6.9/0.85≈8.1kW。", exp:"轴向柱塞泵排量公式 V=z·(πd²/4)·D·tanγ，柱塞行程 h=D·tanγ 由斜盘倾角决定。记牢：改变 γ 即改变排量（变量泵原理）。注意单位统一（m、m³/r）。"},
    {q:"试说明齿轮泵产生困油现象的原因、危害及消除措施，并分析齿轮泵径向液压力不平衡的原因及减小措施。", tag:"齿轮泵困油与径向力", ans:"困油现象：齿轮泵啮合过程中，当前一对轮齿尚未脱离啮合、后一对轮齿已进入啮合时，两啮合点之间形成与吸、压油腔均不相通的封闭容积；该容积随齿轮转动先逐渐减小、后逐渐增大。容积减小时被困油液受挤压、压力急剧升高，容积增大时形成局部真空。\n危害：压力冲击与噪声、振动，真空区产生气穴与气蚀，增大轴承负荷，影响泵的平稳性与寿命。\n消除措施：在两侧端盖上开设卸荷槽——使封闭容积减小时与压油腔相通、增大时与吸油腔相通，卸掉困油压力并补油。\n径向力不平衡原因：压油腔压力高、吸油腔压力低，齿轮圆周上径向压力分布不均，合成一个指向吸油腔方向的径向合力，使轴承和齿轮轴偏载、磨损加剧。\n减小措施：① 缩小压油口尺寸（减小高压区作用范围）；② 适当增大齿顶与泵体的径向间隙（形成压力过渡区）；③ 在泵盖上开设压力平衡槽等。", exp:"困油现象答题链：形成原因（两对齿同时啮合→封闭容积先缩后扩）→ 危害（压力冲击+气穴）→ 措施（端盖卸荷槽，核心是减小时通压油腔、增大时通吸油腔）。径向力不平衡：压差→指向吸油腔的合力→轴承偏载，三措施为缩压油口、增径向间隙、开平衡槽。"}
  ]},
  {id:"h4", name:"第4章 液压马达与液压缸", points:[
    {t:"液压缸的推力与速度", d:"<p><span class='f'>F = p·A　　v = q/A</span></p><p>无杆腔面积 <span class='f'>A₁ = πD²/4</span>；有杆腔面积 <span class='f'>A₂ = π(D²−d²)/4</span></p><p>单活塞杆缸：无杆腔进油速度慢、推力大；有杆腔进油速度快、推力小（A₁>A₂）。</p>"},
    {t:"差动连接", d:"<p>单活塞杆缸<b>两腔同时通压力油</b>即差动连接：</p><p><span class='f'>v = q/(A₁−A₂)　　F = p(A₁−A₂)</span></p><p>效果：<b>快进速度提高</b>（v=4q/πd²），但推力减小。常用于“快进—工进—快退”循环的快进阶段。</p>"},
    {t:"液压马达", d:"<p>液压马达与泵<b>结构原理可逆</b>，但要求：启动转矩大、最低稳定转速低、泄漏小。</p><p>转速公式：<span class='f'>n = q·ηv / V</span>（转速与输入流量成正比，与排量成反比）</p>"},
    {t:"常见液压缸类型", d:"<p>① <b>单活塞杆缸</b>——双向不等速，应用最广；② <b>双活塞杆缸</b>——双向等速（可作差动）；③ <b>柱塞缸</b>——单作用，靠外力回程，内壁不需精加工；④ <b>摆动缸</b>——输出回转摆动；⑤ <b>伸缩缸</b>——多级套筒，行程大。</p>"},
    {t:"液压缸的缓冲与排气", d:"<p><span class='k'>缓冲装置</span>：活塞高速运动到行程终端前减速制动，防止撞击缸盖（节流缓冲、可调缓冲），用于运动速度较高的液压缸。</p><p><span class='k'>排气装置</span>：液压缸最高处设排气阀；空气混入会引起<b>爬行</b>（低速时一停一顿）、噪声和容积损失。</p>"}
  ], quiz:[
    {q:"单活塞杆液压缸无杆腔进油时，若活塞有效面积为 A₁，则推力 F 为（ ）。", opts:["F=pA₁","F=pA₂","F=p(A₁−A₂)","F=pA₁/2"], a:0, exp:"无杆腔进油时有效作用面积为 A₁，F=pA₁。"},
    {q:"液压缸差动连接时，活塞运动速度 v=（ ）。", opts:["q/A₁","q/A₂","q/(A₁−A₂)","q/(A₁+A₂)"], a:2, exp:"差动连接时有效作用面积为 A₁−A₂，v=q/(A₁−A₂)。"},
    {q:"差动连接主要用于（ ）。", opts:["提高推力","提高运动速度","提高系统效率","减小系统流量"], a:1, exp:"差动连接使快进速度提高（相当于用活塞杆面积代替活塞面积），但推力减小。"},
    {q:"双活塞杆液压缸的特点是（ ）。", opts:["双向速度不等","双向速度相等","只能单向运动","推力为零"], a:1, exp:"两腔有效面积相等，故双向速度、推力相同。"},
    {q:"判断题：液压马达的转速与输入流量成正比，与排量成反比。", opts:["正确","错误"], a:0, exp:"n=qηv/V，流量越大转速越高，排量越大转速越低。"},
    {q:"柱塞缸的主要特点是（ ）。", opts:["双向作用","缸体内壁需精加工","缸体内壁不需精加工","两腔有效面积相等"], a:2, exp:"柱塞缸为单作用缸，柱塞与缸体内壁不接触，内壁不需精加工，适合长行程（如导轨磨床）。"},
    {q:"增压缸实现增压的原理是（ ）。", opts:["流量连续","大小活塞的面积比","伯努利方程","动力黏度"], a:1, exp:"增压缸由大面积活塞（低压腔）推动小面积柱塞（高压腔），p₂=p₁·A₁/A₂，靠面积比增压。"},
    {q:"判断题：液压缸产生爬行现象的原因之一是系统内混入空气。", opts:["正确","错误"], a:0, exp:"空气具有可压缩性，低速运动时引起时动时停的爬行，故液压缸需设排气装置。"}
  ], calc:[
    {q:"单活塞杆液压缸，活塞直径 D=80mm，活塞杆直径 d=40mm，供油压力 p=5MPa，流量 q=30L/min。求：①无杆腔进油时的推力 F₁ 和速度 v₁；②有杆腔进油时的推力 F₂ 和速度 v₂；③若改为差动连接，快进速度 v₃ 和推力 F₃。", tag:"液压缸计算", ans:"A₁=πD²/4=π×0.08²/4=5.03×10⁻³m²；A₂=π(D²−d²)/4=π×(0.08²−0.04²)/4=3.77×10⁻³m²。\n① F₁=pA₁=5×10⁶×5.03×10⁻³≈25.1kN；v₁=q/A₁=(30×10⁻³/60)/5.03×10⁻³≈0.099m/s。\n② F₂=pA₂=5×10⁶×3.77×10⁻³≈18.9kN；v₂=q/A₂=(30×10⁻³/60)/3.77×10⁻³≈0.133m/s。\n③ 差动连接：有效作用面积 A₃=A₁−A₂=πd²/4=1.26×10⁻³m²；v₃=q/A₃=(30×10⁻³/60)/1.26×10⁻³≈0.40m/s；F₃=p·A₃≈6.3kN。", exp:"三问核心公式 F=pA、v=q/A；差动连接有效面积为活塞杆面积 πd²/4（即 A₁−A₂），速度最快但推力最小——快进、工进、快退循环中快进用差动就是为此。注意单位：q 换算 m³/s（L/min÷60÷1000）。"},
    {q:"某液压马达排量 V=100mL/r，输入流量 q=150L/min，输入压力 p=10MPa，背压 p₀=0.5MPa，容积效率 ηv=0.95，机械效率 ηm=0.92。求：①马达转速 n；②马达输出转矩 T。", tag:"液压马达计算", ans:"① n=q·ηv/V=(150×10⁻³/60)×0.95/(100×10⁻⁶)=23.75r/s=1425r/min。\n② 理论转矩 Tₜ=Δp·V/(2π)=(10−0.5)×10⁶×100×10⁻⁶/(2π)≈151.2N·m；实际输出转矩 T=Tₜ·ηm=151.2×0.92≈139N·m。", exp:"马达两个公式：转速 n=q·ηv/V（容积效率体现在转速上），转矩 T=Δp·V·ηm/(2π)（机械效率体现在转矩上）。Δp 为进出口压差=输入压力−背压，千万别忘减背压。"},
    {q:"增压缸：低压腔活塞直径 D₁=100mm，高压腔柱塞直径 d₂=20mm，输入压力 p₁=2MPa、流量 q₁=40L/min（不计泄漏）。求：①增压比 K 与输出压力 p₂；②活塞（柱塞）运动速度 v；③高压腔输出流量 q₂。", tag:"增压缸计算", ans:"① A₁=πD₁²/4=π×0.1²/4=7.85×10⁻³m²；A₂=πd₂²/4=π×0.02²/4=3.14×10⁻⁴m²；增压比 K=A₁/A₂=7.85×10⁻³/3.14×10⁻⁴=25；p₂=K·p₁=25×2=50MPa。\n② 活塞与柱塞固连为一体，速度相同：v=q₁/A₁=(40×10⁻³/60)/7.85×10⁻³≈0.085m/s。\n③ q₂=A₂·v=q₁·A₂/A₁=q₁/K=40/25=1.6L/min。", exp:"增压缸靠大小面积比增压：p₂=p₁·A₁/A₂（压力放大 K 倍），同时流量缩小 K 倍 q₂=q₁/K——增压不增功率（忽略损失）。活塞与柱塞固连故速度相同 v=q₁/A₁=q₂/A₂。增压缸常用于液压机、注塑机等需要超高压的场合。"}
  ]},
  {id:"h5", name:"第5章 液压控制阀", points:[
    {t:"方向控制阀与中位机能", d:"<p>换向阀按“位—通”分类，如三位四通阀。中位机能是常考点：</p><p>① <span class='k'>O型</span>：各油口全封闭——缸<b>锁紧</b>、泵<b>不卸荷</b>；② <span class='k'>H型</span>：全互通——泵<b>卸荷</b>、缸<b>浮动</b>；③ <span class='k'>M型</span>：P、T通——泵<b>卸荷</b>、缸<b>锁紧</b>；④ P型、Y型等。</p>"},
    {t:"溢流阀", d:"<p>并联安装、阀口<b>常闭</b>，调定压力为系统最高压力。两大作用：</p><p>① <span class='k'>定压溢流</span>：节流调速时维持系统压力恒定；② <span class='k'>安全保护</span>：系统过载时溢流降压。</p><p>溢流阀工作时阀口常开溢流，进出油口压力近似相等。</p>"},
    {t:"减压阀与顺序阀", d:"<p><span class='k'>减压阀</span>：<b>串联</b>安装、阀口<b>常开</b>，使出口压力低于进口并<b>保持恒定</b>；泄油口单独接油箱。</p><p><span class='k'>顺序阀</span>：按压力控制油路通断，实现顺序动作；泄油口单独接油箱。</p><p>对比记忆：<b>溢流阀并联常闭、减压阀串联常开</b>。</p>"},
    {t:"流量控制阀", d:"<p><span class='k'>节流阀</span>：靠改变节流口面积调流量，但<b>负载变化时流量不稳定</b>（流量受压差影响）。</p><p><span class='k'>调速阀</span>＝<b>定差减压阀 + 节流阀串联</b>：减压阀自动补偿压差，使节流阀前后压差恒定，<b>流量基本稳定</b>。</p>"},
    {t:"单向阀与液控单向阀", d:"<p><span class='k'>单向阀</span>：只允许油液单方向流动，反向截止。</p><p><span class='k'>液控单向阀</span>：有控制油口，通控制油时可反向导通；常用于<b>锁紧回路</b>（液压缸双向锁紧）。</p>"},
    {t:"换向阀的控制方式", d:"<p>① <b>手动/机动</b>（行程挡铁推动）——简单可靠；② <b>电磁换向阀</b>——电气控制、响应快，但电磁铁吸力有限，用于中低压小流量；③ <b>液动换向阀</b>——靠控制油路换向，通流能力大；④ <b>电液换向阀</b>＝电磁先导 + 液动主阀，用电磁铁控制小流量先导阀、再由先导油驱动主阀，实现<b>大流量电气远程控制</b>——考研高频考点。</p>"}
  ], quiz:[
    {q:"溢流阀在系统中的安装方式为（ ）。", opts:["串联","并联","串并联均可","视负载而定"], a:1, exp:"溢流阀与主油路并联，阀口常闭，达到调定压力时溢流。"},
    {q:"调速阀由（ ）与节流阀串联组成。", opts:["溢流阀","定差减压阀","顺序阀","单向阀"], a:1, exp:"调速阀=定差减压阀+节流阀，减压阀保证节流阀压差恒定。"},
    {q:"三位四通换向阀 O 型中位机能的特点是（ ）。", opts:["各油口全封闭，缸锁紧","泵卸荷、缸浮动","进油回油互通","压力油直接回油箱"], a:0, exp:"O型中位四口全闭，液压缸锁紧，但泵不卸荷，需另设卸荷回路。"},
    {q:"减压阀阀口初始状态为（ ），用于保持出口压力恒定。", opts:["常闭","常开","常通","周期性启闭"], a:1, exp:"减压阀初始阀口开启，出口压力升高时阀口关小，使出口压力恒定。"},
    {q:"液控单向阀常用于（ ）回路。", opts:["卸荷","锁紧","调速","增压"], a:1, exp:"液控单向阀可反向导通，两个液控单向阀组成双向液压锁，用于锁紧回路。"},
    {q:"判断题：节流阀的流量随负载变化而变化，调速阀则基本稳定。", opts:["正确","错误"], a:0, exp:"节流阀流量受压差影响；调速阀通过定差减压阀补偿压差，流量稳定。"},
    {q:"电液换向阀适用于（ ）。", opts:["小流量系统","大流量系统","低压系统","手动操作"], a:1, exp:"电磁先导+液动主阀：小电磁铁控制先导阀，先导油推动主阀芯，适合中大流量系统。"},
    {q:"三位四通换向阀 P 型中位机能的特点是（ ）。", opts:["四油口全封闭","P与A、B相通，T封闭","P与T相通","A、B、T相通"], a:1, exp:"P型中位：压力油同时进入A、B两腔（可实现差动），T口封闭，泵不卸荷。"},
    {q:"判断题：液控单向阀的控制油口通入压力油后，油液可以反向流动。", opts:["正确","错误"], a:0, exp:"液控单向阀在控制油作用下顶开阀芯，允许反向流动；两个液控单向阀可组成液压锁。"}
  ], calc:[
    {q:"液压系统中，溢流阀调定压力 py=10MPa，减压阀调定压力 pj=4MPa。液压缸无杆腔负载所需压力 p₁=3MPa，有杆腔经减压阀供油。求：①有杆腔压力 p₂；②若负载增大使 p₁=5MPa（仍小于 py），p₂ 又为多少？并说明减压阀的工作原理。", tag:"减压阀分析", ans:"① p₂=4MPa——减压阀保持出口压力恒定等于其调定压力（进口压力 10MPa＞调定值 4MPa，且出口负载未超过调定值）。\n② p₁=5MPa 时，p₂ 仍恒为 4MPa。\n工作原理：减压阀为串联安装、阀口常开；出口压力升高时，出口油液经阀芯阻尼孔作用于阀芯上端，推动阀芯下移关小阀口，使出口压力下降；出口压力降低时阀口开大，从而自动维持出口压力恒定。", exp:"核心结论：减压阀出口压力恒定等于调定压力（前提：进口压力＞调定压力且出口有流量）。对比记忆：溢流阀进口压力恒定（并联、常闭），减压阀出口压力恒定（串联、常开）。若出口负载压力超过调定值，减压阀阀口全开，出口压力随负载升高而升高。"},
    {q:"三位四通换向阀的 O 型、H 型、M 型、P 型中位机能各有何特点？分别适用于什么场合？", tag:"换向阀中位机能", ans:"① O 型：四个油口全封闭——液压缸两腔锁紧、泵不卸荷。适用于需要锁紧而泵可继续工作的系统；换向冲击较大。\n② H 型：四个油口全部互通——泵卸荷、液压缸两腔与油箱相通呈浮动状态。适用于要求泵卸荷且缸能浮动（可手动调整）的场合；换向冲击大。\n③ M 型：P 与 T 相通、A 与 B 封闭——泵卸荷、液压缸锁紧。应用最广，兼得卸荷与锁紧，适用于组合机床动力滑台等中低压系统。\n④ P 型：P 与 A、B 相通、T 封闭——压力油同时进入两腔（可形成差动）、泵不卸荷。适用于需要差动连接的回路。", exp:"中位机能按锁紧看 A/B、卸荷看 P/T 记忆：A、B 封闭→缸锁紧；P、T 相通→泵卸荷。O 型全封（锁紧不卸荷）、H 型全通（卸荷加浮动）、M 型 P-T 通（卸荷加锁紧）、P 型 P-A/B 通（差动）。"}
  ]},
  {id:"h6", name:"第6章 基本回路与典型系统", points:[
    {t:"压力控制回路", d:"<p>① <span class='k'>调压回路</span>：溢流阀调定系统压力；② <span class='k'>减压回路</span>：减压阀获得低于主油路的压力；③ <span class='k'>卸荷回路</span>：M型/H型中位换向、先导式溢流阀遥控口接油箱、电磁溢流阀；④ <span class='k'>保压回路</span>：蓄能器保压、液控单向阀保压。</p>"},
    {t:"调速回路（重点）", d:"<p>① <span class='k'>节流调速</span>：进油节流、回油节流、旁路节流——用定量泵+节流阀，<b>效率低、发热大</b>；进/回油节流时溢流阀<b>定压溢流</b>，旁路节流时溢流阀作<b>安全阀</b>。</p><p>② <span class='k'>容积调速</span>：变量泵/变量马达——<b>效率高、发热小</b>。</p><p>③ <span class='k'>容积节流调速</span>：限压式变量泵+调速阀，兼顾效率与调速刚性。</p>"},
    {t:"快速运动与换向、锁紧回路", d:"<p><span class='k'>快速运动</span>：差动连接、蓄能器供油、双泵供油（大泵+小泵）。</p><p><span class='k'>换向回路</span>：电磁换向阀、电液换向阀；<span class='k'>锁紧回路</span>：液控单向阀（液压锁）、O型中位机能。</p>"},
    {t:"顺序动作与同步回路", d:"<p><span class='k'>顺序动作回路</span>：顺序阀、压力继电器、行程开关（行程控制最可靠）。</p><p><span class='k'>同步回路</span>：分流阀同步、串联缸同步、同步缸同步、机械刚性同步。</p><p><span class='k'>典型系统</span>：组合机床动力滑台（限压式变量泵+调速阀、差动快进，实现快进—工进—快退）、液压机（增压缸+保压）、注塑机。</p>"},
    {t:"平衡回路与保压回路", d:"<p><span class='k'>平衡回路</span>：立式液压缸防止自重快速下落，在回油路串接<b>单向顺序阀（平衡阀）</b>建立背压，使自重与背压平衡，运动平稳。</p><p><span class='k'>保压回路</span>：系统需在某一压力下保持较长时间（如液压机压制），用<b>液控单向阀</b>封闭油路，再以<b>蓄能器</b>补偿泄漏维持压力。</p>"}
  ], quiz:[
    {q:"在进油节流调速回路中，溢流阀的作用是（ ）。", opts:["安全保护","定压溢流","卸荷","建立背压"], a:1, exp:"进油/回油节流调速时，定量泵多余流量经溢流阀溢流，溢流阀起定压溢流作用；旁路节流时作安全阀。"},
    {q:"容积调速回路与节流调速回路相比，主要优点是（ ）。", opts:["结构简单","效率高、发热小","速度稳定性好","成本低"], a:1, exp:"容积调速无节流损失和溢流损失，效率高、发热小。"},
    {q:"实现“快进—工进—快退”循环时，快进阶段常采用（ ）提高速度。", opts:["增大泵的额定压力","差动连接","降低负载","串联调速阀"], a:1, exp:"差动连接可使快进速度提高，是快速运动回路的常用方法。"},
    {q:"使泵在系统不工作时卸荷，可采用（ ）。", opts:["先导式溢流阀遥控口接油箱","节流阀","减压阀","单向阀"], a:0, exp:"先导式溢流阀遥控口通过二位二通阀接油箱，可使泵低压卸荷。"},
    {q:"顺序动作回路可用（ ）实现。", opts:["顺序阀","调速阀","节流阀","单向阀"], a:0, exp:"顺序阀按压力控制油路通断，使各缸按预定顺序动作。"},
    {q:"判断题：旁路节流调速回路中，溢流阀作安全阀使用。", opts:["正确","错误"], a:0, exp:"旁路节流时泵的流量大部分经旁路节流阀回油箱，溢流阀仅在过载时开启，作安全阀。"},
    {q:"防止立式液压缸因自重快速下落的回路是（ ）。", opts:["锁紧回路","平衡回路","卸荷回路","增压回路"], a:1, exp:"平衡回路用单向顺序阀在回油路建立背压，平衡自重，防止超速下落。"},
    {q:"采用 M 型或 H 型中位机能的换向阀可以实现（ ）。", opts:["保压","泵的卸荷","增压","同步"], a:1, exp:"M型、H型中位P与T相通，泵排油直接回油箱，泵在近零压下运转即卸荷。"},
    {q:"判断题：双泵供油回路中，快速运动时大、小泵同时供油，工进时大泵卸荷、小泵单独供油。", opts:["正确","错误"], a:0, exp:"双泵供油（大泵+小泵）快进时合流供油，工进时大泵卸荷，既快又省能。"}
  ], calc:[
    {q:"进油节流调速回路：定量泵流量 qp=25L/min，溢流阀调定压力 py=5MPa，液压缸无杆腔面积 A₁=50cm²，有杆腔面积 A₂=25cm²（回油直通油箱），负载 F=5000N。节流阀为薄壁小孔，流量系数 Cd=0.62，节流口面积 A₀=5mm²，油液密度 ρ=900kg/m³。求：①无杆腔工作压力 p₁；②通过节流阀的流量 q₁；③活塞运动速度 v；④溢流阀溢流量 qy。", tag:"进油节流调速计算", ans:"① p₁=F/A₁=5000/(50×10⁻⁴)=1×10⁶Pa=1MPa。\n② 节流阀前后压差 Δp=py−p₁=5−1=4MPa；q₁=Cd·A₀·√(2Δp/ρ)=0.62×5×10⁻⁶×√(2×4×10⁶/900)=0.62×5×10⁻⁶×94.3≈2.92×10⁻⁴m³/s≈17.5L/min。\n③ v=q₁/A₁=2.92×10⁻⁴/(50×10⁻⁴)≈0.058m/s。\n④ qy=qp−q₁=25−17.5=7.5L/min（经溢流阀回油箱）。", exp:"进油节流调速解题链：负载定压力 p₁=F/A₁ → 溢流阀定泵压 py → 节流阀压差 Δp=py−p₁ → 孔口流量公式 q=Cd·A·√(2Δp/ρ) → v=q₁/A₁ → 多余流量 qy=qp−q₁ 溢流。核心结论：负载越大 p₁ 越大、Δp 越小、速度越慢，即速度随负载变化——调速刚性差、效率低（泵始终在高压下输出全部流量），这是节流调速的固有缺点。"},
    {q:"试分析组合机床动力滑台「快进—工进—快退」工作循环中：①快进阶段如何提高运动速度（给出两种方法及原理）；②工进阶段如何保证速度稳定；③快退阶段速度为何比工进快。", tag:"回路综合分析", ans:"① 快进提高速度的方法：差动连接——液压缸两腔同时通压力油，有效作用面积由 A₁ 减为活塞杆面积 πd²/4，泵流量不变时速度提高到约 A₁/(πd²/4) 倍；双泵供油——快进时大泵小泵合流供油，供油流量加倍，速度相应提高。\n② 工进速度稳定：采用限压式变量泵＋调速阀的容积节流调速回路；调速阀由定差减压阀与节流阀串联组成，减压阀自动补偿负载变化引起的压差波动，使节流阀前后压差恒定，流量基本不受负载影响；同时工进时大泵卸荷、小泵单独供油，减少溢流损失、降低发热。\n③ 快退阶段有杆腔进油，有效作用面积 A₂=A₁−πd²/4＜A₁，且可差动或双泵供油，故 v快退=q/A₂＞v工进=q₁/A₁。", exp:"这是 810 液压大题的高频综合题。回答框架：快进（差动连接/双泵合流/蓄能器供油）→ 工进（大泵卸荷、调速阀稳速）→ 快退（有杆腔面积小、速度快）。要点：调速阀稳定速度的原理是定差减压阀补偿压差，使节流阀压差恒定。"},
    {q:"变量泵—定量马达容积调速回路：定量马达排量 V=40mL/r，泵最大输出流量 qpmax=100L/min（泵容积效率 ηvp=0.95），马达容积效率 ηvm=0.95、机械效率 ηm=0.9，负载转矩 T=50N·m。求：①马达最高转速 nmax；②马达输出功率 P₀；③若负载转矩增大到 100N·m，马达转速将如何变化？为什么？", tag:"容积调速计算", ans:"① 泵实际输出流量 qp=qpmax·ηvp=100×0.95=95L/min；马达输入流量 qm=qp；nmax=qm·ηvm/V=(95×10⁻³/60)×0.95/(40×10⁻⁶)=1.504×10⁻³/40×10⁻⁶≈37.6r/s≈2256r/min。\n② P₀=T·ω=50×2π×37.6≈50×236.2≈11.8kW。\n③ 负载转矩增大→马达进出口压差 Δp 升高→泵和马达泄漏量增大→马达实际转速略降。容积调速无节流与溢流损失、速度刚性较好，转速随负载变化不大；若负载超过溢流阀调定压力对应的转矩，溢流阀开启、马达停转。", exp:"容积调速核心：n 由泵流量与马达排量决定 n=q·ηvm/V，与负载基本无关；负载增大时靠压力升高传递转矩，仅因泄漏使转速略降。与节流调速相比效率高、发热小、速度刚性大，是高压大功率系统的首选。"}
  ]}
  ,{id:"h7", name:"第7章 液压辅助元件", points:[
    {t:"油箱与滤油器", d:"<p><span class='k'>油箱</span>：储存油液、散热冷却、沉淀杂质、分离空气与水分；容积一般为泵每分钟流量的<b>3~7倍</b>。</p><p><span class='k'>滤油器</span>：按过滤精度分粗、普通、精滤；吸油口滤油器保护泵（阻力要小），回油路滤油器过滤系统杂质；要求压降小、纳污量大、易清洗。</p>"},
    {t:"蓄能器", d:"<p>储存压力能的元件，<b>气囊式</b>最常用（气体加载式）。作用：① 短时大量供油实现快速运动；② <b>保压</b>：补偿系统泄漏维持压力；③ 吸收<b>压力脉动与液压冲击</b>；④ 作应急动力源。</p><p>充气压力一般<b>低于系统最低工作压力</b>；气囊式蓄能器应垂直安装（气体在上）。</p>"},
    {t:"密封装置", d:"<p>作用：防止内、外泄漏，防止外界杂质侵入。分类：<span class='k'>间隙密封</span>（靠微小配合间隙，用于泵、阀内相对运动表面，无摩擦但有泄漏）；<span class='k'>接触密封</span>（O形圈、Y形圈、V形圈等，密封可靠）。</p><p>O形圈应用最广，既可用于静密封也可用于动密封；Y形圈用于往复运动密封。</p>"},
    {t:"管路与热交换器", d:"<p><span class='k'>管路</span>：硬管（钢管、铜管）用于无相对运动的固定连接；<b>软管（橡胶管）</b>用于有相对运动的部件之间，但压损大、寿命短。</p><p><span class='k'>热交换器</span>：冷却器与加热器，使油温保持在<b>30~50℃</b>左右；油温过高黏度下降、泄漏增大、密封老化，油温过低黏度增大、压力损失大。</p>"}
  ], quiz:[
    {q:"蓄能器在液压系统中的作用不包括（ ）。", opts:["短时大量供油","保压补偿泄漏","吸收压力脉动与冲击","增大压力损失"], a:3, exp:"蓄能器储存和释放压力能，可快速供油、保压、吸收冲击；不会增大压力损失。"},
    {q:"液压系统油箱的容积一般取泵每分钟流量的（ ）。", opts:["1~2倍","3~7倍","10~20倍","0.5倍"], a:1, exp:"油箱兼作散热器，容积过小散热不足、油温升高，一般取泵流量的3~7倍。"},
    {q:"装在液压泵吸油口处的滤油器，其主要作用是（ ）。", opts:["过滤系统回油杂质","保护液压泵","过滤油箱空气","控制流量"], a:1, exp:"吸油口滤油器防止杂质进入泵内，保护泵；但阻力过大易造成吸油不足，故要求压降小。"},
    {q:"气囊式蓄能器安装时一般要求（ ）。", opts:["水平安装","垂直安装、气体端朝上","倒置安装","任意位置"], a:1, exp:"气囊式蓄能器垂直安装使气体在上，防止气囊与阀座摩擦损坏。"},
    {q:"判断题：O形密封圈既可用于静密封，也可用于动密封，应用最广。", opts:["正确","错误"], a:0, exp:"O形圈结构简单、密封性好，静动密封均可使用，是应用最广的密封件。"}
  ], calc:[
    {q:"蓄能器在液压系统中有哪些作用？气囊式蓄能器安装时应注意什么？为什么？", tag:"简答", ans:"蓄能器的作用：① 储存压力能，短时大量供油，实现快速运动；② 保压——补偿系统泄漏，维持压力恒定；③ 吸收压力脉动与液压冲击，保护系统和元件；④ 作应急动力源（系统失压时释放能量）。\n安装注意事项：气囊式蓄能器应垂直安装，且充气阀（气体端）朝上。原因：气囊中气体密度远小于油液，垂直安装时气囊浮于上部，避免气囊与壳体或阀座相互摩擦而损坏，同时便于充气和检修。", exp:"作用四条要记全（快速供油、保压、吸收冲击、应急源）；安装方向原因要答出防止气囊与阀座摩擦损坏。充气压力一般低于系统最低工作压力，也是常考点。"}
  ]}
  ,{id:"h8", name:"第8章 伺服阀、比例阀与插装阀", points:[
    {t:"电液伺服阀", d:"<p>由<b>力矩马达（电磁部分）+ 液压放大器（喷嘴挡板/滑阀）+ 反馈机构</b>组成，将微小的电气信号（电流）转换成大功率的液压信号（流量/压力）。</p><p>特点：精度高、响应快、可闭环控制，但结构复杂、价格高、<b>对油液清洁度要求极高</b>（一般需 5μm 级过滤），用于高精度位置/速度/力控制。</p>"},
    {t:"电液比例阀", d:"<p>用<b>比例电磁铁</b>将输入电信号连续地、按比例地转换成阀芯位移，从而连续控制压力、流量或方向，性能介于开关阀与伺服阀之间。</p><p>特点：控制性能优于开关阀、价格低于伺服阀、<b>抗污染能力强</b>，多用于开环或简单闭环控制。</p>"},
    {t:"插装阀（二通插装阀）", d:"<p>由<b>阀芯、阀套、弹簧、控制盖板</b>组成，插装在集成块孔内，靠先导控制油控制阀芯开闭。</p><p>特点：<b>通流能力大</b>（适合大流量）、响应快、密封好、一阀多用，通过不同先导控制可构成方向、压力、流量控制回路，广泛用于大流量系统。</p>"},
    {t:"叠加阀与数字阀", d:"<p><span class='k'>叠加阀</span>：阀体既是控制元件又是连接通道，各阀<b>叠加安装</b>在换向阀与底板之间，无需管路连接，结构紧凑。</p><p><span class='k'>数字阀</span>：用步进电机或高速开关阀接受数字信号直接控制，抗污染、便于计算机控制。</p>"}
  ], quiz:[
    {q:"电液伺服阀对油液清洁度的要求（ ）。", opts:["很低","很高","无要求","与普通阀相同"], a:1, exp:"伺服阀节流边间隙小、精度高，油液污染会卡死阀芯或磨损节流边，故要求极高清洁度。"},
    {q:"电液比例阀与普通开关阀的主要区别是（ ）。", opts:["输出流量或压力可连续比例调节","只能开或关","不需电源","结构完全相同"], a:0, exp:"比例电磁铁使阀芯位移与输入电流成比例，输出连续可调；开关阀只有通断两态。"},
    {q:"二通插装阀的主要优点是（ ）。", opts:["通流能力大、响应快","结构最简单","只能作单向阀","只能用于低压"], a:0, exp:"插装阀通流面积大、行程短，适合大流量系统，响应快、密封好。"},
    {q:"判断题：电液伺服阀输入微小的电信号，输出液压功率，具有功率放大作用。", opts:["正确","错误"], a:0, exp:"伺服阀是电—液转换和功率放大元件，小信号控制大功率。"},
    {q:"判断题：比例阀的抗污染能力一般优于伺服阀，价格也较低。", opts:["正确","错误"], a:0, exp:"比例阀结构相对简单、对污染不敏感，价格低，性能介于开关阀与伺服阀之间。"}
  ], calc:[
    {q:"电液伺服阀、电液比例阀与普通开关阀在控制方式上有何区别？为什么伺服阀对油液清洁度要求极高？", tag:"简答", ans:"区别：\n① 普通开关阀：只有通/断两种状态，输出不可连续调节；\n② 电液比例阀：用比例电磁铁使阀芯位移与输入电流成比例，输出压力、流量可连续按比例调节，性能介于开关阀与伺服阀之间，抗污染能力强、价格较低；\n③ 电液伺服阀：将微小电信号经力矩马达和液压放大器转换为大功率液压输出，精度高、响应快、可闭环控制，但结构复杂、价格高。\n伺服阀要求极高清洁度的原因：其节流边间隙很小（微米级），靠微小阀芯位移精确控制流量；油液中的污染颗粒会卡死阀芯、磨损节流边或堵塞喷嘴挡板，导致控制失灵甚至元件报废，故一般需 5μm 级精细过滤。", exp:"比较类简答按开关阀→比例阀→伺服阀递进组织：控制方式（通断/比例/连续高精度）、性能、价格、抗污染能力四方面对比。伺服阀 5μm 过滤、比例阀抗污染强是高频考点。"}
  ]},
  {id:"h9", name:"第9章 液压系统的设计与计算", points:[
    {t:"设计步骤与参数确定", d:"<p>基本步骤：<b>明确工作要求 → 确定执行元件形式与运动参数 → 确定主要参数（压力 p、流量 q）→ 拟定液压系统图 → 选择元件 → 验算（压力损失、发热温升）</b>。</p><p>工作压力主要按<b>负载大小</b>选定，兼顾效率与元件体积；流量按执行元件需要的最大流量与泄漏确定。</p>"},
    {t:"液压泵与电动机的选择", d:"<p>泵的额定压力应<b>高于系统最大工作压力 25% 左右</b>；泵的流量取系统所需最大流量与<b>泄漏系数</b>（1.1~1.3）的乘积。</p><p>驱动功率：<span class='f'>P = p·qᵣ/η</span>（p 为泵出口压力，qᵣ 为泵实际流量），据此选电动机并留有余量避免过载。</p>"},
    {t:"系统验算与温升控制", d:"<p>压力损失验算：沿程＋局部损失，校核执行元件能否获得所需压力。</p><p>效率与发热：系统效率 <span class='f'>η = 输出功率/输入功率</span>，损失的功率转化为热量；油箱散热不足会使油温升高，<b>油液正常工作温度一般为 50~70℃</b>，超过 80℃ 必须采取措施（增大油箱、冷却器）。</p>"},
    {t:"油箱与过滤器", d:"<p><span class='k'>油箱</span>：兼有<b>储油、散热、沉淀杂质、分离空气</b>的作用；应设油标、通气器、放油口，吸油口与回油口用隔板分开。</p><p><span class='k'>过滤器</span>安装位置：① <b>吸油管路</b>（保护泵，精度较低但通流能力大）；② <b>回油管路</b>（滤除系统杂质）；③ <b>压油管路</b>（精密过滤，装在阀前保护精密元件）。</p>"}
  ], quiz:[
    {q:"液压系统设计中，确定工作压力的主要依据是（ ）。", opts:["流量大小","负载大小","管径","油液黏度"], a:1, exp:"工作压力主要按负载大小选定，兼顾效率、体积和元件承压能力。"},
    {q:"液压泵的额定压力一般应比系统最大工作压力（ ）。", opts:["低 25%","相等","高 25% 左右","低 50%"], a:2, exp:"为保证可靠性与寿命，泵的额定压力须高于最大工作压力并留有余量（约 25%）。"},
    {q:"液压系统正常工作时油液的适宜温度范围是（ ）。", opts:["0~10℃","25~40℃","50~70℃","90~110℃"], a:2, exp:"50~70℃ 为正常工作温度；超过 80℃ 需采取散热或冷却措施。"},
    {q:"回油路过滤器的主要作用是（ ）。", opts:["保护液压泵","滤除系统回油中的杂质","增大回油背压","冷却油液"], a:1, exp:"回油过滤器设在回油管路，滤除执行元件等产生的污染物，防止进入油箱后污染系统。"},
    {q:"判断题：液压系统中过滤器安装在吸油管路上主要是为了保护液压泵。", opts:["正确","错误"], a:0, exp:"泵对污染最敏感，吸油口过滤是保护泵的第一道防线，但精度不能过高以免吸油阻力过大。"},
    {q:"液压系统设计时，一般应先确定（ ）。", opts:["液压泵型号","执行元件形式与主要参数","阀的型号","油箱容积"], a:1, exp:"设计顺序：先定执行元件（缸/马达）的形式与参数，再据此选择泵、阀并验算。"}
  ], calc:[
    {q:"设计某液压系统：系统最大工作压力为 7MPa，液压缸最大流量需求 q=40L/min。试选择液压泵的额定压力和额定流量，并计算所需电动机功率（泵的总效率 η=0.85，泄漏系数取 1.2）。", tag:"泵与电动机选型", ans:"① 泵的额定压力：应高于系统最大工作压力约 25%，pₙ=7×1.25=8.75MPa，选额定压力 10MPa 的液压泵。\n② 泵的流量：qₚ=1.2×40=48L/min=0.8×10⁻³m³/s（泄漏系数 1.1~1.3 保证供油充足）。\n③ 电动机功率：P=p·qₚ/η=8×10⁶×0.8×10⁻³/0.85≈7.53kW，选 7.5kW 标准电动机，并校核启动转矩与短时过载能力。", exp:"选型三要点：① 额定压力=系统最大工作压力×1.25 左右；② 流量=最大需求流量×泄漏系数(1.1~1.3)；③ 电机功率 P=pq/η，p 取泵的实际工作压力，选标准功率并留余量。设计顺序：先定执行元件参数，再选泵，后选阀。"},
    {q:"某定量泵液压系统：泵出口压力 p=6MPa、流量 q=40L/min、泵总效率 ηp=0.85，系统实际输出功率 P₀=2.5kW。油箱散热面积 A=1.2m²，散热系数 k=15W/(m²·℃)，环境温度 t₀=25℃。求：①泵的输入功率 Pᵢ；②系统总效率 η；③系统损失的功率 ΔP；④估算油液平衡温度并判断是否需要加强散热。", tag:"系统验算与温升", ans:"① Pᵢ=p·q/ηp=6×10⁶×(40×10⁻³/60)/0.85=4000/0.85≈4.71kW。\n② η=P₀/Pᵢ=2500/4705.9≈0.53≈53%。\n③ ΔP=Pᵢ−P₀=4705.9−2500≈2.21kW（损失的功率全部转化为热量）。\n④ 热平衡时散热功率=发热功率：ΔP=k·A·(t−t₀)，t−t₀=2205.9/(15×1.2)≈122.6℃，t≈25+122.6=147.6℃，远高于正常工作温度（50~70℃），必须加强散热：增大油箱容积、增设冷却器、减小节流损失等。", exp:"系统验算两步：① 功率链 Pᵢ=pq/ηp→P₀→η=P₀/Pᵢ，损失的功率即发热功率；② 热平衡方程 ΔP=kA(t−t₀) 估算油温，油温超过 80℃ 必须采取冷却措施。设计时应先提高系统效率（容积调速优于节流调速）再考虑散热。"}
  ]}
]},
mech:{
  id:"mech", name:"机械原理", author:"孙桓（孙恒）", icon:"⚙️", color:"#f59e0b", bg:"var(--orangebg)",
  desc:"810 机械综合指定教材（考纲占 75 分，5-6 道大题）。研究机构的结构、运动与动力。重点：自由度、连杆、凸轮、齿轮、轮系、平衡与速度波动。",
  chapters:[
  {id:"m1", name:"第1章 机构的结构分析", points:[
    {t:"构件、零件与运动副", d:"<p><span class='k'>构件</span>是运动的最小单元（可能由多个零件组成），<span class='k'>零件</span>是制造的最小单元。</p><p><span class='k'>运动副</span>：两构件直接接触并能产生一定相对运动的连接。</p><p><b>低副</b>（面接触：转动副、移动副）引入<b>2个约束</b>；<b>高副</b>（点、线接触：齿轮、凸轮）引入<b>1个约束</b>。</p>"},
    {t:"平面机构自由度", d:"<p><span class='f'>F = 3n − 2PL − PH</span></p><p>n——活动构件数；PL——低副数；PH——高副数。</p>"},
    {t:"三类特殊情况", d:"<p>① <span class='k'>复合铰链</span>：k 个构件在一处铰接，转动副数 = <b>k−1</b>；② <span class='k'>局部自由度</span>：如凸轮机构中的滚子，计算时<b>滚子不计</b>（局部自由度不影响机构运动）；③ <span class='k'>虚约束</span>：重复的约束，计算时<b>去除</b>。</p>"},
    {t:"机构具有确定运动的条件", d:"<p>F &gt; 0 且 <b>F = 原动件数</b>：机构具有确定运动。</p><p>F &lt; 0：超静定桁架，不能运动；F &gt; 原动件数：运动不确定；F = 原动件数：确定运动。</p>"}
  ], quiz:[
    {q:"平面机构自由度计算公式为（ ）。", opts:["F=3n−2PL−PH","F=3n−PL−PH","F=2n−PL−PH","F=3n−2PL"], a:0, exp:"F=3n−2PL−PH，低副引入2个约束，高副引入1个约束。"},
    {q:"三个构件在一处用铰链相连，该复合铰链相当于（ ）个转动副。", opts:["1","2","3","4"], a:1, exp:"k=3个构件汇交，转动副数为k−1=2个。"},
    {q:"凸轮机构中从动件端部的滚子属于（ ）。", opts:["虚约束","局部自由度","复合铰链","高副"], a:1, exp:"滚子绕自身轴线转动不影响从动件运动规律，是局部自由度，计算时不计入。"},
    {q:"机构具有确定运动的条件是（ ）。", opts:["F>0","F>0且F=原动件数","F<原动件数","F=0"], a:1, exp:"自由度大于零且等于原动件数时，机构运动确定。"},
    {q:"判断题：两构件构成高副时，引入1个约束、保留2个自由度。", opts:["正确","错误"], a:0, exp:"平面自由构件有3个自由度，高副引入1个约束，保留2个自由度。"}
  ], calc:[
    {q:"计算图示机构自由度：活动构件数 n=8，低副数 PL=11（其中已包含复合铰链折算数），高副数 PH=1，原动件数=1。判断该机构是否具有确定运动。", tag:"自由度计算", ans:"F=3n−2PL−PH=3×8−2×11−1=24−22−1=1。\nF=1=原动件数，机构具有确定运动。", exp:"套公式 F=3n−2PL−PH。三个易错点：① 复合铰链：k 个构件铰接处算 k−1 个转动副；② 局部自由度（如滚子）不计入构件数；③ 虚约束要去除后再数 PL、PH。数清低副（转动副＋移动副）与高副（点/线接触）是得分关键。"},
    {q:"图示凸轮机构由凸轮、滚子、从动件及机架组成。若直接把滚子作为活动构件：n=3，PL=3（凸轮与机架转动副、滚子与从动件转动副、从动件与机架移动副），PH=1（凸轮与滚子高副）。试计算自由度，并说明局部自由度应如何处理。", tag:"自由度计算（局部自由度）", ans:"直接计算：F=3n−2PL−PH=3×3−2×3−1=2。\n但滚子绕自身轴线的转动对从动件运动规律无影响，属局部自由度，应把滚子与从动件固结为一体（去掉滚子转动副）再计算：n=2，PL=2，PH=1，F=3×2−2×2−1=1。", exp:"局部自由度处理原则：将滚子与从动件焊死（其转动副不计入 PL）再算。本题 F=1，与凸轮机构只有一个原动件的实际情况相符，验证了处理方法的正确性。"},
    {q:"图示平行四边形机构：活动构件 n=4（原动件 1、连杆 2、从动件 3、附加构件 4），构件 4 与连杆 2 平行且长度相等，各铰链均为转动副，低副总数 PL=6，高副 PH=0。①直接计算自由度 F；②指出机构中的虚约束并修正后重新计算；③说明引入虚约束的目的。", tag:"自由度计算（虚约束）", ans:"① 直接计算：F=3n−2PL−PH=3×4−2×6−0=0，与机构实际运动不符，说明存在虚约束。\n② 构件 4 与连杆 2 平行等长，其两端铰链提供的约束与构件 2 重复，对机构运动不起独立限制作用，属虚约束，应去除：去除构件 4 及其两个转动副后，n=3，PL=4（机架与 1、1 与 2、2 与 3、3 与机架），F=3×3−2×4−0=1，与机构实际自由度相符。\n③ 引入虚约束的目的：改善构件受力、增加机构刚度（如多缸发动机的曲柄滑块机构并联）、保证机构顺利通过死点等；但虚约束对制造与装配精度要求高，否则会转化为实际约束产生附加应力。", exp:"虚约束判断：两构件间引入的重复约束（如平行四边形机构中平行等长的附加构件、两构件构成多处同向移动副、对称布置的重复结构等）。计算三步：先查复合铰链（k 构件铰接算 k−1 个转动副）→ 再去局部自由度（滚子）→ 最后去虚约束，再套 F=3n−2PL−PH。"}
  ]},
  {id:"m2", name:"第2章 平面连杆机构", points:[
    {t:"铰链四杆机构的基本类型", d:"<p>① <span class='k'>曲柄摇杆机构</span>：一杆能整周回转、一杆只能摆动；② <span class='k'>双曲柄机构</span>：两连架杆都能整周回转（含平行四边形机构——对边平行且相等）；③ <span class='k'>双摇杆机构</span>：两连架杆都只能摆动。</p>"},
    {t:"曲柄存在条件（重点）", d:"<p>① <b>杆长条件</b>：最短杆 + 最长杆 ≤ 其余两杆长度之和；② 最短杆为<b>连架杆或机架</b>。</p><p>最短杆为<b>连架杆</b>→曲柄摇杆机构；最短杆为<b>机架</b>→双曲柄机构；<b>不满足杆长条件</b>→双摇杆机构。</p>"},
    {t:"急回特性", d:"<p>从动摇杆往复摆动的平均速度不等称为急回。行程速比系数：<span class='f'>K = (180°+θ)/(180°−θ)</span></p><p>θ 为<b>极位夹角</b>（曲柄与连杆两次共线时曲柄所夹锐角）。θ&gt;0 ⇔ K&gt;1 ⇔ 有急回；对心曲柄滑块机构 θ=0、K=1，无急回。</p>"},
    {t:"压力角与传动角", d:"<p><span class='k'>压力角 α</span>：驱动力方向与速度方向所夹锐角；<span class='k'>传动角 γ</span>：压力角的余角。</p><p><span class='f'>γ = 90° − α</span></p><p>γ 越大传力性能越好，一般要求 <b>γmin ≥ 40°~50°</b>；γmin 出现在曲柄与机架共线的两个位置之一。</p>"},
    {t:"死点位置", d:"<p>以<b>摇杆为主动件</b>、曲柄与<b>连杆共线</b>时，传动角 γ=0，机构出现<b>死点</b>（如缝纫机踏板机构）。</p><p><span class='k'>克服</span>：加飞轮、多组机构错位布置；<span class='k'>利用</span>：飞机起落架、钻床夹紧机构。</p>"}
  ], quiz:[
    {q:"铰链四杆机构中曲柄存在的杆长条件是（ ）。", opts:["最短杆与最长杆之和≤其余两杆之和","最短杆与最长杆之和≥其余两杆之和","四杆长度必须相等","无任何限制"], a:0, exp:"杆长条件：最短杆+最长杆≤其余两杆之和，且最短杆为连架杆或机架。"},
    {q:"铰链四杆机构满足杆长条件且最短杆为机架时，机构为（ ）。", opts:["曲柄摇杆机构","双曲柄机构","双摇杆机构","曲柄滑块机构"], a:1, exp:"最短杆为机架→两连架杆均可整周回转→双曲柄机构。"},
    {q:"行程速比系数 K 与极位夹角 θ 的关系为（ ）。", opts:["K=θ/180°","K=(180°+θ)/(180°−θ)","K=(180°−θ)/(180°+θ)","K=1/θ"], a:1, exp:"K=(180°+θ)/(180°−θ)，θ越大急回越显著。"},
    {q:"传动角 γ 与压力角 α 的关系为（ ）。", opts:["γ=α","γ=90°−α","γ=90°+α","γ=180°−α"], a:1, exp:"传动角是压力角的余角：γ=90°−α。"},
    {q:"曲柄摇杆机构以摇杆为主动件时，死点位置出现在（ ）。", opts:["曲柄与连杆共线时","摇杆与机架共线时","曲柄与机架共线时","任意位置"], a:0, exp:"摇杆主动时，曲柄与连杆共线、传动角为0的位置是死点。"},
    {q:"判断题：急回特性越显著，行程速比系数 K 越大。", opts:["正确","错误"], a:0, exp:"K=(180°+θ)/(180°−θ)，θ越大K越大，急回越显著。"}
  ], calc:[
    {q:"铰链四杆机构各杆长度：l₁=240mm（机架）、l₂=600mm、l₃=400mm、l₄=500mm。试判断该机构属于何种类型。若将最短杆改为连架杆，机构又为何种类型？", tag:"曲柄存在条件", ans:"① 检验杆长条件：最短杆 l₁=240 与最长杆 l₂=600 之和=840mm，其余两杆之和 l₃+l₄=400+500=900mm，840＜900，满足杆长条件。\n② 最短杆 l₁ 为机架→两连架杆均可整周回转，机构为双曲柄机构。\n③ 若最短杆为连架杆→构成曲柄摇杆机构；若最短杆为连杆→构成双摇杆机构（注意：满足杆长条件时连杆可以不是最短杆，判断要看最短杆位置）。", exp:"判断三步：① 最短+最长≤其余两杆之和？不满足→必为双摇杆；② 满足时看最短杆位置——机架→双曲柄、连架杆→曲柄摇杆、连杆→双摇杆。"},
    {q:"一曲柄摇杆机构，摇杆工作行程（慢行程）与回程（快行程）所用时间之比 t₁:t₂=1.2:1。求：①行程速比系数 K；②极位夹角 θ；③该机构是否存在死点？在什么条件下出现？", tag:"急回特性+死点", ans:"① 两行程摇杆摆角相同，平均速度与时间成反比：K=v快/v慢=t₁/t₂=1.2。\n② 由 K=(180°+θ)/(180°−θ)：1.2=(180°+θ)/(180°−θ)，解得 θ=180°×(1.2−1)/(1.2+1)=180°×0.2/2.2≈16.4°。\n③ 以曲柄为主动件时无死点；若改以摇杆 CD 为主动件，当曲柄与连杆共线时传动角 γ=0，出现两个死点位置，需用飞轮或错位布置克服。", exp:"K 的定义是快行程平均速度/慢行程平均速度，本题由时间比直接得 K=1.2。死点与主动件选择有关：曲柄主动无死点、摇杆主动有死点（曲柄与连杆共线处）。"},
    {q:"对心曲柄滑块机构：曲柄长 r=50mm，连杆长 l=200mm，曲柄转速 n=600r/min。求：①滑块行程 H；②极位夹角 θ 与行程速比系数 K；③滑块最大速度 vmax（近似值）。", tag:"曲柄滑块机构", ans:"① 对心曲柄滑块机构滑块行程等于两倍曲柄长：H=2r=2×50=100mm。\n② 对心机构曲柄与连杆两次共线时滑块分别位于两个极限位置，两极限位置关于曲柄回转中心对称，极位夹角 θ=0°；K=(180°+θ)/(180°−θ)=1，无急回特性。\n③ 滑块速度近似为曲柄端点速度在滑块运动方向上的分量，曲柄与连杆垂直时分量最大：ω=2πn/60=2π×600/60=62.8rad/s；vmax≈ω·r=62.8×0.05≈3.14m/s。", exp:"对心曲柄滑块：H=2r、θ=0、K=1（无急回）；偏置曲柄滑块机构才有急回特性（K＞1）。vmax≈ωr 出现在曲柄与连杆垂直位置。曲柄滑块机构是内燃机、压缩机等的核心机构。"}
  ]},
  {id:"m3", name:"第3章 凸轮机构", points:[
    {t:"基本参数", d:"<p><span class='k'>基圆半径 r0</span>：凸轮理论廓线的最小向径；<span class='k'>行程 h</span>：从动件最大位移。</p><p>四个运动角：<b>推程运动角 δ0、远休止角 δs、回程运动角 δ0′、近休止角 δs′</b>。</p>"},
    {t:"从动件运动规律与冲击（重点）", d:"<p>① <span class='k'>等速运动</span>：速度突变→<b>刚性冲击</b>（推程始末点）；② <span class='k'>等加速等减速</span>：加速度突变→<b>柔性冲击</b>；③ <span class='k'>余弦加速度（简谐）</span>：始末点加速度突变→柔性冲击；④ <span class='k'>正弦加速度</span>：加速度连续→<b>无冲击</b>，高速场合首选。</p>"},
    {t:"压力角与基圆半径", d:"<p>压力角 α 越大，有效分力越小、传力越差，甚至自锁。<b>增大基圆半径 r0，压力角减小</b>，但机构尺寸增大。</p><p>许用压力角：直动从动件推程 [α]=30°~38°，摆动从动件推程 [α]=40°~45°，回程可取大些。</p>"},
    {t:"反转法设计凸轮廓线", d:"<p>给整个凸轮机构加上一个与凸轮角速度 ω <b>相反的角速度 −ω</b>，凸轮静止不动，从动件连同机架绕凸轮轴<b>反转</b>，同时按运动规律相对机架运动——按此包络出凸轮廓线。</p>"}
  ], quiz:[
    {q:"从动件作等速运动时，在推程始末点会产生（ ）。", opts:["柔性冲击","刚性冲击","无冲击","周期性振动"], a:1, exp:"等速运动速度在始末点突变，加速度无穷大，产生刚性冲击。"},
    {q:"从动件按正弦加速度运动规律运动时（ ）。", opts:["有刚性冲击","有柔性冲击","无冲击","冲击最大"], a:2, exp:"正弦加速度运动的速度、加速度均连续变化，无冲击，适合高速。"},
    {q:"增大凸轮基圆半径，压力角将（ ）。", opts:["增大","减小","不变","先增大后减小"], a:1, exp:"基圆半径越大，廓线越平缓，压力角越小，但尺寸增大。"},
    {q:"设计凸轮廓线常用的基本方法是（ ）。", opts:["反转法","转化轮系法","速度瞬心法","叠加法"], a:0, exp:"反转法（相对运动法）是设计凸轮廓线的经典方法。"},
    {q:"判断题：凸轮机构压力角越大，传力性能越差，甚至可能发生自锁。", opts:["正确","错误"], a:0, exp:"压力角大则有效分力小，摩擦阻力大，可能自锁，故有许用压力角限制。"}
  ], calc:[
    {q:"从动件采用等速运动、等加速等减速运动、余弦加速度（简谐）运动和正弦加速度运动规律时，分别产生什么性质的冲击？为什么高速凸轮机构宜采用正弦加速度运动规律？", tag:"运动规律与冲击", ans:"① 等速运动：推程始、末点速度突变，加速度理论上为无穷大，产生刚性冲击；\n② 等加速等减速运动：加速度在始点、中点和末点发生有限值突变，产生柔性冲击；\n③ 余弦加速度（简谐）运动：始、末点加速度突变，产生柔性冲击；\n④ 正弦加速度运动：速度、加速度均连续变化、无突变，不产生任何冲击。\n故高速凸轮机构宜采用正弦加速度运动规律（或改进梯形等无冲击规律）。", exp:"判断冲击性质看加速度：速度突变→刚性冲击；加速度有限值突变→柔性冲击；加速度连续→无冲击。等速只适合低速轻载，正弦加速度适合高速。"},
    {q:"尖顶直动从动件盘形凸轮：推程运动角 δ0=120°，推程 h=30mm，从动件按等加速等减速运动规律运动。求：①推程前半段转角 δ=30° 时的位移 s；②说明该运动规律在推程始点、中点、终点处的加速度变化及冲击性质；③若改按正弦加速度运动规律，冲击性质如何？", tag:"凸轮运动规律计算", ans:"① 等加速等减速前半程（0≤δ≤δ0/2）位移公式：s=2h(δ/δ0)²=2×30×(30/120)²=60×0.0625=3.75mm。\n② 等加速等减速运动：速度曲线连续无突变，但在推程始点（δ=0）、中点（δ=δ0/2）和终点（δ=δ0）三处加速度发生有限值突变，产生柔性冲击，故只适用于中低速场合。\n③ 正弦加速度运动：速度、加速度均连续变化、无突变，不产生任何冲击，适合高速凸轮机构。", exp:"等加速等减速位移公式：前半 s=2h(δ/δ0)²、后半 s=h−2h(δ0−δ)²/δ0²。冲击性质看加速度：速度突变→刚性冲击；加速度有限值突变→柔性冲击；加速度连续→无冲击。正弦加速度（摆线）规律是高速首选。"}
  ]},
  {id:"m4", name:"第4章 齿轮机构", points:[
    {t:"齿廓啮合基本定律", d:"<p>相互啮合的一对齿廓在<b>任意接触点处的公法线必须通过节点 P</b>，才能保证传动比恒定。</p><p>渐开线齿廓满足该定律，且具有<b>中心距可分性</b>（中心距略有变化不影响传动比）。</p>"},
    {t:"渐开线的性质", d:"<p>① 发生线沿基圆<b>纯滚动</b>，渐开线上任一点的法线<b>必切于基圆</b>；② <b>基圆内无渐开线</b>；③ 渐开线形状取决于基圆大小（基圆越大越平直，基圆无穷大时为直线——齿条）；④ 渐开线上各点压力角不同，<b>基圆上压力角为0</b>。</p>"},
    {t:"基本参数与几何尺寸", d:"<p>模数 m（<b>标准化</b>）、压力角 α=20°、齿数 z、齿顶高系数 ha*=1、顶隙系数 c*=0.25。</p><p><span class='f'>d = mz　　db = d·cosα　　p = πm　　a = m(z₁+z₂)/2</span></p><p>标准齿轮分度圆上<b>齿厚=齿槽宽=p/2</b>。</p>"},
    {t:"啮合条件", d:"<p><span class='k'>正确啮合条件</span>：两轮<b>模数相等、压力角相等</b>（m₁=m₂，α₁=α₂）。</p><p><span class='k'>连续传动条件</span>：重合度 <b>εα ≥ 1</b>（工程上常取 εα ≥ 1.1~1.2）；重合度越大，传动越平稳。</p>"},
    {t:"根切与变位", d:"<p>用范成法切齿时，齿数过少会发生<b>根切</b>，削弱齿根强度。标准齿轮不发生根切的最小齿数：<span class='f'>zmin = 17</span>（α=20°、ha*=1 时）。</p><p><span class='k'>正变位</span>：刀具远离轮坯，可切制更少齿数不根切、提高齿根强度；负变位反之。</p>"},
    {t:"斜齿轮与蜗轮蜗杆", d:"<p><b>斜齿轮</b>：螺旋角 β，<b>法面参数为标准值</b>，端面模数 <span class='f'>mt = mn/cosβ</span>；啮合平稳、承载大，但有<b>轴向力</b>（可用人字齿轮抵消）。</p><p><b>蜗轮蜗杆</b>：传动比 <span class='f'>i = z₂/z₁</span>（与分度圆直径<b>无关</b>！）；蜗杆头数少→传动比大；效率较低，蜗杆螺旋升角小于当量摩擦角时可<b>自锁</b>。</p>"}
  ], quiz:[
    {q:"渐开线直齿圆柱齿轮正确啮合的条件是（ ）。", opts:["模数相等、压力角相等","齿数相等","分度圆直径相等","基圆直径相等"], a:0, exp:"正确啮合条件：m₁=m₂、α₁=α₂；齿数相等不是必要条件。"},
    {q:"渐开线齿轮连续传动的条件为（ ）。", opts:["重合度εα≥1","重合度εα≤1","重合度εα≥2","重合度εα=0"], a:0, exp:"前一对轮齿尚未脱离啮合时后一对必须已进入啮合，即 εα≥1。"},
    {q:"标准直齿圆柱齿轮分度圆直径 d=（ ）。", opts:["mz","mz/2","m(z+2)","m(z−2)"], a:0, exp:"d=mz；m(z+2)是齿顶圆直径 da。"},
    {q:"分度圆压力角 α=20°、ha*=1 的标准齿轮不发生根切的最小齿数为（ ）。", opts:["14","17","20","25"], a:1, exp:"zmin=2ha*/sin²α≈17，齿数少于17会产生根切。"},
    {q:"一对蜗轮蜗杆传动，蜗杆头数 z₁=2，蜗轮齿数 z₂=40，传动比 i=（ ）。", opts:["20","40","80","2"], a:0, exp:"i=z₂/z₁=40/2=20，蜗杆传动的传动比与分度圆直径无关。"},
    {q:"与直齿轮相比，斜齿轮的主要优点是（ ）。", opts:["无轴向力","传动平稳、承载能力大","不会根切","加工简单"], a:1, exp:"斜齿轮啮合线增长、重合度大，传动平稳、承载大；缺点是产生轴向力。"},
    {q:"判断题：渐开线齿轮传动瞬时传动比恒定，且中心距略有变化不影响传动比。", opts:["正确","错误"], a:0, exp:"这是渐开线齿轮的“中心距可分性”，是渐开线齿廓的突出优点。"}
  ], calc:[
    {q:"一对标准渐开线直齿圆柱齿轮：z₁=20，z₂=60，模数 m=4mm，压力角 α=20°，ha*=1，c*=0.25。求：①分度圆直径 d₁、d₂；②基圆直径 db₁、db₂；③齿顶圆直径 da₁、da₂；④标准中心距 a；⑤若实际中心距增大 0.5mm，传动比是否改变？为什么？", tag:"齿轮几何尺寸计算", ans:"① d₁=mz₁=4×20=80mm；d₂=4×60=240mm。\n② db₁=d₁·cosα=80×cos20°≈75.2mm；db₂=240×cos20°≈225.5mm。\n③ da₁=m(z₁+2)=4×22=88mm；da₂=4×62=248mm。\n④ a=m(z₁+z₂)/2=4×(20+60)/2=160mm。\n⑤ 传动比不变：i=z₂/z₁=60/20=3，仅由齿数比决定；渐开线齿轮具有中心距可分性，中心距变化不影响传动比（但侧隙与重合度会变化）。", exp:"标准直齿轮六要素：d=mz、db=d·cosα、da=m(z+2)、df=m(z−2.5)、p=πm、a=m(z₁+z₂)/2。中心距可分性是渐开线齿轮最常考的结论。"},
    {q:"标准直齿圆柱齿轮 α=20°、ha*=1。①求标准齿轮不发生根切的最小齿数 zmin；②若 z₁=14，用范成法加工是否会发生根切？为什么？③若采用正变位加工 z₁=14 的齿轮，说明正变位如何避免根切。", tag:"根切与变位", ans:"① zmin=2ha*/sin²α=2/sin²20°=2/0.117≈17.1，取 zmin=17。\n② z₁=14＜17，范成法加工时刀具齿顶线超过啮合极限点，会切入轮坯齿根部，产生根切，削弱齿根强度并可能破坏渐开线齿廓。\n③ 正变位：刀具远离轮坯中心（变位系数 x＞0），刀具齿顶线随之外移、低于啮合极限点，从而可切制 z＜17 的齿轮而不根切；同时正变位还能提高齿根强度和凑配中心距。", exp:"zmin=17 必须记牢（α=20°、ha*=1 时）。正变位三作用：避免根切、提高齿根强度、凑配中心距；负变位反之（易根切、齿根变弱）。"},
    {q:"一对标准斜齿圆柱齿轮：z₁=24、z₂=96、法面模数 mn=3mm、螺旋角 β=12°、法面压力角 αn=20°。求：①端面模数 mt；②分度圆直径 d₁、d₂；③标准中心距 a；④简述斜齿轮传动的主要优缺点。", tag:"斜齿轮几何计算", ans:"① mt=mn/cosβ=3/cos12°=3/0.9781≈3.067mm。\n② d₁=mt·z₁=3.067×24≈73.6mm；d₂=mt·z₂=3.067×96≈294.4mm。\n③ a=mt(z₁+z₂)/2=3.067×(24+96)/2=3.067×60≈184.0mm。\n④ 优点：轮齿沿轴向倾斜，啮合线增长、同时啮合齿对数增多，重合度大，传动平稳、噪声小、承载能力强；缺点：产生轴向力 Fa=Ft·tanβ，需采用推力轴承或人字齿轮（两侧螺旋角相反）抵消，β 越大轴向力越大。", exp:"斜齿轮要点：法面参数（mn、αn）为标准值，但几何尺寸用端面参数计算——mt=mn/cosβ、d=mt·z、a=mt(z₁+z₂)/2。重合度大是斜齿轮平稳承载的关键；轴向力是其主要缺点，人字齿轮可完全抵消。"}
  ]},
  {id:"m5", name:"第5章 轮系", points:[
    {t:"定轴轮系", d:"<p>所有齿轮轴线都固定的轮系。传动比：<span class='f'>i = (−1)ᵐ × 所有从动轮齿数连乘积 / 所有主动轮齿数连乘积</span></p><p>m 为<b>外啮合次数</b>，决定末轮转向；<span class='k'>惰轮</span>（过桥轮）只改变转向，<b>不改变传动比大小</b>。</p>"},
    {t:"周转轮系", d:"<p>至少有一个齿轮的轴线绕另一固定轴线回转。构件：<b>行星轮</b>（既自转又公转）、<b>系杆 H</b>、<b>中心轮</b>（太阳轮）。</p><p><span class='k'>差动轮系</span>：两个中心轮都运动，F=2；<span class='k'>行星轮系</span>：一个中心轮固定，F=1。</p>"},
    {t:"转化轮系法（反转法）", d:"<p>给整个轮系加上一个 <b>−nH</b> 的公共转速，周转轮系转化为<b>定轴轮系</b>：</p><p><span class='f'>i₁₃ᴴ = (n₁−nH)/(n₃−nH) = −z₃/z₁</span>（符号由啮合关系定）</p><p>列出转化轮系传动比方程，再结合已知条件（如 n₃=0）求解。</p>"},
    {t:"混合轮系与轮系功用", d:"<p><span class='k'>混合轮系</span>：先分清<b>定轴部分</b>和<b>周转部分</b>，分别列方程，再<b>联立求解</b>（关键是找行星轮与系杆）。</p><p><span class='k'>轮系功用</span>：实现大传动比、变速与换向、运动合成与分解、分路传动、远距离传动。</p>"}
  ], quiz:[
    {q:"定轴轮系传动比计算中，外啮合齿轮对数 m 的作用是确定（ ）。", opts:["传动比大小","末轮转向","传动效率","齿轮齿数"], a:1, exp:"(−1)ᵐ 只决定末轮转向：外啮合一次转向相反一次。"},
    {q:"惰轮（过桥轮）对轮系的作用是（ ）。", opts:["增大传动比","改变转向而不改变传动比大小","减小传动比","提高效率"], a:1, exp:"惰轮只改变转向，不改变传动比大小。"},
    {q:"差动轮系的自由度为（ ）。", opts:["1","2","0","3"], a:1, exp:"差动轮系两个中心轮均不固定，F=2；固定一个中心轮为行星轮系，F=1。"},
    {q:"求解周转轮系传动比采用的基本方法是（ ）。", opts:["转化轮系法（反转法）","速度瞬心法","速度多边形法","图解法"], a:0, exp:"加−nH把周转轮系转化为定轴轮系，再按定轴轮系公式计算。"},
    {q:"判断题：行星轮系中有一个中心轮固定，自由度为1。", opts:["正确","错误"], a:0, exp:"一个中心轮固定，则只需一个原动件即可确定运动，F=1。"}
  ], calc:[
    {q:"定轴轮系：z₁=18，z₂=54（外啮合），z₂′=20，z₃=80（外啮合），z₃′=25，z₄=100（外啮合），主动轮 1 转速 n₁=1450r/min。求：①总传动比 i₁₄；②末轮转速 n₄ 及其转向。", tag:"定轴轮系计算", ans:"① i₁₄=(−1)ᵐ·(z₂·z₃·z₄)/(z₁·z₂′·z₃′)=(−1)³×(54×80×100)/(18×20×25)=−216000/9000=−24。\n② n₄=n₁/i₁₄=1450/(−24)≈−60.4r/min；负号表示末轮 4 与主动轮 1 转向相反。", exp:"定轴轮系公式：i=(−1)ᵐ·∏从动齿数/∏主动齿数，m 为外啮合对数（外啮合一次转向相反一次）。惰轮（过桥轮）只改变转向、不改变传动比大小。注意：轮系中同时参与啮合的齿轮成对找。"},
    {q:"行星轮系：中心轮 1（z₁=20）为主动件，系杆 H 输出，内齿圈 3 固定（z₃=80），行星轮 2（z₂=30）空套在系杆上，n₁=1000r/min。求系杆转速 nH 及转向。", tag:"周转轮系（转化法）", ans:"用转化轮系法：给整个轮系加 −nH，将周转轮系转化为定轴轮系：i₁₃ᴴ=(n₁−nH)/(n₃−nH)。\n转化轮系中 1→2 为外啮合、2→3 为内啮合，故 i₁₃ᴴ=(−z₂/z₁)·(z₃/z₂)=−z₃/z₁=−80/20=−4。\n内齿圈固定 n₃=0：(1000−nH)/(0−nH)=−4 → 1000−nH=4nH → nH=200r/min。\n系杆 H 与中心轮 1 转向相同。", exp:"转化轮系法三步：① 整体加 −nH 转定轴；② 列 i₁₃ᴴ=(n₁−nH)/(n₃−nH)，符号由啮合类型定（外啮合取负、内啮合取正）；③ 代入固定件 n=0 求解。本题也可用公式 i₁H=1+z₃/z₁=1+80/20=5 验证：nH=n₁/5=200r/min。"},
    {q:"混合轮系：定轴部分齿轮 1（z₁=20）与齿轮 2（z₂=40）外啮合，齿轮 2 与 2′（z₂′=25）同轴固连；周转部分由中心轮 3（z₃=30）、行星轮 4（z₄=25）、内齿圈 5（z₅=80，固定）及系杆 H 组成，2′ 与 3 外啮合，n₁=1200r/min。求：①定轴部分传动比 i₁₂ 与齿轮 2 转速 n₂；②中心轮 3 转速 n₃；③系杆 H 转速 nH。", tag:"混合轮系计算", ans:"① 定轴部分：i₁₂=(−1)¹·z₂/z₁=−40/20=−2；n₂=n₁/i₁₂=1200/(−2)=−600r/min（与 1 反向）。\n② 齿轮 2′ 与 2 同轴：n₂′=n₂=−600r/min；2′ 与 3 外啮合：n₃=−(z₂′/z₃)·n₂′=−(25/30)×(−600)=+500r/min（与 1 同向）。\n③ 周转部分（3 为太阳轮、5 固定、H 为系杆）：转化轮系法 i₃₅ᴴ=(n₃−nH)/(n₅−nH)=(−z₄/z₃)·(z₅/z₄)=−z₅/z₃=−80/30=−8/3；n₅=0：(500−nH)/(0−nH)=−8/3 → 500−nH=(8/3)nH → nH=500×3/11≈136.4r/min（与 1 同向）。", exp:"混合轮系解题步骤：① 找行星轮（轴线运动的齿轮）与系杆，划分定轴部分与周转部分；② 定轴部分用 i=(−1)ᵐ·∏从动/∏主动 依次传递；③ 周转部分用转化轮系法列 (n−nH)/(n−nH) 方程，固定件转速取 0；④ 联立求解。本题通过 2′→3 把两部分连接起来，是典型结构。"}
  ]},
  {id:"m6", name:"第6章 间歇运动机构", points:[
    {t:"棘轮机构", d:"<p>棘爪推动棘轮作<b>单向间歇转动</b>。优点：结构简单、<b>转角可调</b>（改变棘爪摆角或遮板）；缺点：冲击、<b>噪声大</b>、精度低。</p><p>类型：单动式、双动式、可变向棘轮（翻转棘爪改变方向）。</p>"},
    {t:"槽轮机构（马氏机构）", d:"<p>圆柱销进入槽轮的<b>径向槽</b>驱动槽轮转动，销离开槽后槽轮停歇。优点：结构简单、<b>运动平稳</b>；缺点：<b>转角不能调节</b>（由槽数 z 决定），且始末有冲击。</p><p>外槽轮径向槽数 <b>z ≥ 3</b>；槽数越多，运动越平稳。</p>"},
    {t:"其他间歇机构", d:"<p><span class='k'>不完全齿轮机构</span>：主动轮只有部分齿，从动轮间歇转动，冲击大；<span class='k'>凸轮式间歇机构</span>：用于高速场合，运动平稳无冲击。</p>"}
  ], quiz:[
    {q:"棘轮机构的主要缺点是（ ）。", opts:["转角不能调节","冲击噪声大","结构复杂","不能单向运动"], a:1, exp:"棘轮机构靠棘爪落入齿槽传动，冲击噪声大，但转角可以调节。"},
    {q:"槽轮机构的转角（ ）。", opts:["可任意调节","由槽数决定，不能调节","由主动件转速决定","随机变化"], a:1, exp:"槽轮每转角度=2π/z（外槽轮），由槽数决定，不可调节。"},
    {q:"外槽轮机构径向槽数最少为（ ）。", opts:["2","3","4","6"], a:1, exp:"外槽轮径向槽数 z≥3，否则无法正常啮合传动。"},
    {q:"判断题：槽轮机构运动比棘轮机构平稳，但转角不能调节。", opts:["正确","错误"], a:0, exp:"槽轮由销与槽啮合，运动较平稳；转角由槽数固定，不能调节。"}
  ], calc:[
    {q:"棘轮机构与槽轮机构各有什么优缺点？分别适用于什么场合？", tag:"简答", ans:"棘轮机构：\n优点——结构简单、制造方便，转角可在一定范围内调节（改变棘爪摆角或遮板位置）；\n缺点——冲击大、噪声大、运动精度低，通常只能单向间歇运动；\n适用——低速、轻载、转角可调的场合（如机床进给机构、超越离合器）。\n槽轮机构：\n优点——结构简单、工作可靠、运动较平稳（圆柱销与径向槽啮合）；\n缺点——转角由槽数决定、不能调节，且始末有冲击；\n适用——定转角、中低速间歇转位（如电影放映机、自动机床转位工作台）。", exp:"对比简答按优点/缺点/适用场合组织。外槽轮槽数 z≥3，槽数越多运动越平稳。高速场合应选用凸轮式间歇机构（无冲击）。"},
    {q:"外槽轮机构：径向槽数 z=4，主动拨盘以 n=30r/min 匀速转动。求：①拨盘转一周所需时间 T；②槽轮每次转位时间 t_d 与停歇时间 t_s；③若槽数改为 z=6，运动系数如何变化？说明槽数对运动平稳性的影响。", tag:"槽轮机构运动系数", ans:"① T=60/n=60/30=2s。\n② 外槽轮运动系数 k=t_d/T=(1/2−1/z)=1/2−1/4=0.25；t_d=k·T=0.25×2=0.5s；t_s=T−t_d=2−0.5=1.5s。\n③ z=6 时：k=1/2−1/6=1/3≈0.333，槽轮转位时间占比增大、停歇时间缩短。\n槽数越多，运动系数越大、转位越接近匀速、运动越平稳（始末冲击越小），但每次转角减小、停歇变短，且结构尺寸增大。", exp:"外槽轮运动系数 k=(1/2−1/z)（恒小于 1/2，z≥3）。z 增大→k 增大→转位平稳性提高。槽轮机构转角由槽数决定、不能调节，是它与棘轮机构（转角可调）的关键区别。"}
  ]},
  {id:"m7", name:"第7章 机械的平衡", points:[
    {t:"静平衡", d:"<p>回转件质量分布在同一平面内（或<b>径宽比 D/b ≥ 5</b> 的盘状件），只需在<b>一个平面</b>内加平衡质量即可平衡，条件：</p><p><span class='f'>ΣF = 0（惯性力合力为零，质心位于回转轴线上）</span></p><p>方法：计算不平衡质量的大小与方位，加重或去重。</p>"},
    {t:"动平衡", d:"<p>轴向尺寸较大（<b>D/b &lt; 5</b>）的回转件，需在<b>两个平衡基面</b>内加平衡质量，条件：</p><p><span class='f'>ΣF = 0 且 ΣM = 0（惯性力合力与合力偶均为零）</span></p>"},
    {t:"静平衡与动平衡的关系", d:"<p><b>动平衡满足 ⟹ 静平衡必满足</b>；静平衡满足 <b>不一定</b> 满足动平衡。</p><p>（动平衡是静平衡+力偶平衡）</p>"}
  ], quiz:[
    {q:"对于径宽比 D/b≥5 的盘状回转件，一般只需进行（ ）。", opts:["动平衡","静平衡","不需平衡","先动平衡再静平衡"], a:1, exp:"D/b≥5 的薄盘件，惯性力偶矩很小，只需单面静平衡。"},
    {q:"动平衡的条件是（ ）。", opts:["ΣF=0","ΣF=0 且 ΣM=0","ΣM=0","质心在轴线上"], a:1, exp:"动平衡要求惯性力合力与合力偶都为零，需两个平衡基面。"},
    {q:"判断题：满足动平衡的回转件一定满足静平衡。", opts:["正确","错误"], a:0, exp:"动平衡包含静平衡条件，故动平衡件必静平衡；反之不一定。"},
    {q:"判断题：对于轴向尺寸较大的回转件（D/b<5），必须在两个平衡基面内进行平衡。", opts:["正确","错误"], a:0, exp:"轴向尺寸大的回转件不平衡惯性力形成力偶，必须双面动平衡。"}
  ], calc:[
    {q:"一转子的三个偏心质量位于同一平面内：m₁=2kg、r₁=80mm、方位角 0°；m₂=3kg、r₂=60mm、方位角 90°；m₃=4kg、r₃=50mm、方位角 210°。求所需平衡质量的大小与方位（平衡半径 r_b=100mm）。", tag:"静平衡计算", ans:"各质径积：m₁r₁=2×80=160kg·mm（0°）；m₂r₂=3×60=180kg·mm（90°）；m₃r₃=4×50=200kg·mm（210°）。\n正交分解：Σx=160cos0°+180cos90°+200cos210°=160+0−173.2=−13.2kg·mm；\nΣy=160sin0°+180sin90°+200sin210°=0+180−100=80kg·mm。\n合质径积 Σ(mr)=√(13.2²+80²)≈81.1kg·mm，方位角 θ=atan2(80,−13.2)≈99.4°（第二象限）。\n平衡条件：m_b·r_b=Σ(mr) 且方向相反，m_b=81.1/100≈0.81kg，方位角 θ_b=99.4°+180°≈279.4°。", exp:"静平衡步骤：① 求各质径积 mᵢrᵢ；② 正交分解求和（注意方位角所在象限，用 atan2 判断）；③ 平衡质径积与合质径积等值反向：m_b·r_b=Σ(mr)、θ_b=θ+180°。"},
    {q:"某细长转子需动平衡，两平衡基面 Ⅰ、Ⅱ 间距 L=400mm。两个不平衡质径积位于同一轴向平面内（方位相同）：m₁r₁=0.4kg·m 在基面Ⅰ右侧 150mm 处，m₂r₂=0.3kg·m 在基面Ⅱ左侧 100mm 处。平衡半径 r_b=0.1m。求：①两基面内各自应消除的不平衡质径积 (mr)Ⅰ、(mr)Ⅱ；②两基面内所需平衡质量 m_bⅠ、m_bⅡ（方向与各基面合质径积相反）。", tag:"动平衡计算", ans:"① 将每个不平衡质径积按距对面基面距离与两基面间距之比分配到两基面：m₁r₁ 距Ⅰ面 150mm、距Ⅱ面 250mm，Ⅰ面得 0.4×250/400=0.25、Ⅱ面得 0.4×150/400=0.15；m₂r₂ 距Ⅰ面 300mm、距Ⅱ面 100mm，Ⅰ面得 0.3×300/400=0.225、Ⅱ面得 0.3×100/400=0.075。\n(mr)Ⅰ=0.25+0.225=0.475kg·m；(mr)Ⅱ=0.15+0.075=0.225kg·m。\n② m_bⅠ=(mr)Ⅰ/r_b=0.475/0.1=4.75kg；m_bⅡ=0.225/0.1=2.25kg；方向与各基面合质径积相反（本题各质径积同向，故在相反方位加重或去重）。", exp:"动平衡要点：轴向尺寸较大（D/b＜5）的回转件，不平衡惯性力形成的力偶不能在单面内平衡，必须选两个平衡基面。分配规则：质径积按到对面基面距离比例分配。动平衡满足时静平衡自动满足，反之不然。"}
  ]},
  {id:"m8", name:"第8章 速度波动的调节", points:[
    {t:"周期性速度波动与飞轮", d:"<p>一个运动循环内驱动力矩与阻力矩做功不等（但总功相等），转速周期性波动。</p><p>用<span class='k'>飞轮</span>调节：飞轮是<b>储能元件</b>——转速高时储存动能，转速低时释放动能；飞轮应装在<b>转速较高的轴</b>上以减小尺寸重量。</p>"},
    {t:"非周期性速度波动与调速器", d:"<p>载荷突变导致驱动力矩与阻力矩长期失衡，用<span class='k'>调速器</span>（离心式调速器）自动调节驱动力矩。</p>"},
    {t:"度量指标与飞轮惯量", d:"<p>平均角速度：<span class='f'>ωm = (ωmax+ωmin)/2</span></p><p>速度不均匀系数：<span class='f'>δ = (ωmax−ωmin)/ωm</span>（δ 越小越平稳）</p><p>飞轮转动惯量：<span class='f'>J ≈ ΔWmax/(ωm²·δ)</span>，ΔWmax 为最大盈亏功。</p>"}
  ], quiz:[
    {q:"周期性速度波动应采用的调节方法是（ ）。", opts:["调速器","飞轮","加大构件质量","提高转速"], a:1, exp:"飞轮储存和释放能量，调节周期性速度波动。"},
    {q:"非周期性速度波动应采用的调节方法是（ ）。", opts:["飞轮","调速器","弹簧","轴承"], a:1, exp:"调速器根据转速变化自动调节驱动力矩，应对非周期性波动。"},
    {q:"速度不均匀系数 δ 的定义为（ ）。", opts:["(ωmax−ωmin)/ωm","(ωmax+ωmin)/2","ωmax/ωmin","(ωmax−ωmin)/2"], a:0, exp:"δ=(ωmax−ωmin)/ωm，是衡量速度波动程度的主要指标。"},
    {q:"判断题：飞轮应尽量安装在转速较高的轴上，以减小飞轮尺寸和重量。", opts:["正确","错误"], a:0, exp:"J∝1/ω²，转速越高所需转动惯量越小，飞轮越小。"}
  ], calc:[
    {q:"某机器主轴平均转速 n=300r/min，许用速度不均匀系数 [δ]=0.02，一个运动循环中的最大盈亏功 ΔWmax=2000J，主轴等效转动惯量 J₀=5kg·m²。求：①主轴角速度 ωmax 与 ωmin；②所需飞轮转动惯量 J_f。", tag:"飞轮转动惯量计算", ans:"① ωm=2πn/60=2π×300/60≈31.4rad/s；\nδ=(ωmax−ωmin)/ωm 且 ωm=(ωmax+ωmin)/2 → ωmax−ωmin=δ·ωm=0.02×31.4=0.628rad/s；\nωmax=ωm+0.314≈31.71rad/s；ωmin=ωm−0.314≈31.09rad/s。\n② J_f=ΔWmax/(ωm²·[δ])−J₀=2000/(31.4²×0.02)−5=2000/19.72−5≈101.4−5=96.4kg·m²。", exp:"两个必背公式：ωm=2πn/60；J_f=ΔWmax/(ωm²·[δ])−J₀（主轴已有等效转动惯量时要减去）。最大盈亏功由能量指示图求。飞轮装在高速轴可减小尺寸（J∝1/ω²）。"},
    {q:"某机器主轴一个运动循环 T=2s：0~1s 内驱动力矩 M_d=100N·m 恒定、阻力矩 M_r=150N·m；1~2s 内阻力矩降为 M_r=50N·m（驱动力矩不变）。主轴平均转速 n=600r/min，许用速度不均匀系数 [δ]=0.03，主轴等效转动惯量忽略不计。求：①一个循环各阶段盈亏功并求最大盈亏功 ΔWmax；②所需飞轮转动惯量 J_f。", tag:"最大盈亏功与飞轮", ans:"① 0~1s：ΔW₁=(M_d−M_r)Δt=(100−150)×1=−50J（亏功）；1~2s：ΔW₂=(100−50)×1=+50J（盈功）；总功 ΔW₁+ΔW₂=0（周期循环）。\n能量指示图：起点 0 → 亏 50J 降至 −50J → 盈 50J 回到 0，最高点与最低点之差 ΔWmax=50J。\n② ωm=2πn/60=2π×600/60≈62.8rad/s；J_f=ΔWmax/(ωm²·[δ])=50/(62.8²×0.03)=50/118.4≈0.42kg·m²。", exp:"最大盈亏功求法：作能量指示图（各阶段盈亏功依次累加、首尾闭合），取图中最高点与最低点的纵坐标之差。飞轮惯量 J_f=ΔWmax/(ωm²·[δ])；主轴已有等效转动惯量 J₀ 时需减去 J₀。飞轮储能释能削峰填谷，装在高速轴可减小尺寸。"}
  ]},
  {id:"m9", name:"第9章 平面机构的运动分析", points:[
    {t:"速度瞬心法", d:"<p><span class='k'>速度瞬心</span>：两构件作平面运动时，同一瞬时<b>相对速度为零（绝对速度相等）</b>的重合点；若其中一构件固定，称为<b>绝对瞬心</b>，否则为<b>相对瞬心</b>。</p><p>机构瞬心总数：<span class='f'>K = N(N−1)/2</span>（N 为构件数，含机架）。</p><p><span class='k'>三心定理</span>：三个彼此作平面运动的构件共有三个瞬心，且<b>位于同一直线上</b>，据此可求任意两个不直接接触构件的瞬心，进而求传动比。</p>"},
    {t:"相对运动图解法（同一构件）", d:"<p>同一构件上两点间的速度、加速度关系用<b>矢量方程图解</b>：</p><p><span class='f'>v_B = v_A + v_BA　　a_B = a_A + a_BA</span></p><p>相对速度 v_BA <b>垂直于 AB 连线</b>；相对加速度 a_BA 分解为<b>法向（指向 A）＋切向（垂直 AB）</b>两部分。</p><p><span class='k'>影像原理</span>：同一构件上各点速度（加速度）矢量终点构成的图形与该构件图形<b>相似且字母顺序一致</b>，可据此求构件上任意点的速度、加速度。</p>"},
    {t:"两构件重合点间的运动与哥氏加速度", d:"<p>两构件用移动副相连时，重合点速度关系：<span class='f'>v_B2 = v_B1 + v_B2B1</span>（B₁属于构件1，B₂属于构件2）。</p><p>当<b>牵连构件转动且相对运动方向与转动不平行</b>时出现哥氏加速度：<span class='f'>a_C = 2ωv_r</span>，方向为相对速度 v_r 沿牵连角速度 ω 方向<b>转过90°</b>。</p><p>口诀：牵连运动为转动＋相对运动为移动且二者不平行 ⟹ 有哥氏加速度。</p>"}
  ], quiz:[
    {q:"三心定理的表述是（ ）。", opts:["任意三个构件的三个瞬心共点","三个作平面运动构件的三个瞬心位于同一直线上","瞬心数等于构件数","两个构件的瞬心重合"], a:1, exp:"三心定理：三个彼此作平面运动的构件共有三个瞬心，它们位于同一条直线上。"},
    {q:"具有 N 个构件的平面机构，其全部瞬心数目为（ ）。", opts:["N","N(N−1)/2","N−1","N(N+1)/2"], a:1, exp:"每两个构件（含机架）有一个瞬心，总数 K=N(N−1)/2。"},
    {q:"判断题：速度影像原理只适用于同一构件上的各点。", opts:["正确","错误"], a:0, exp:"影像原理建立在刚体上各点绝对运动关系的基础上，因此只适用于同一构件。"},
    {q:"哥氏加速度出现的条件是（ ）。", opts:["牵连运动为移动且相对运动为移动","牵连运动为转动且相对运动方向与转动平行","牵连运动为转动且相对运动方向与转动不平行","牵连运动为移动且相对运动为转动"], a:2, exp:"牵连运动为转动、相对运动为移动且二者不平行时才会出现哥氏加速度 2ωv_r。"},
    {q:"同一构件上 A、B 两点的速度关系 v_B = v_A + v_BA 中，v_BA 的方向（ ）。", opts:["平行于 AB","垂直于 AB","沿 AB 指向 A","任意"], a:1, exp:"v_BA 是 B 相对 A 的转动速度，方向垂直于连线 AB。"}
  ], calc:[
    {q:"平面四杆机构共 4 个构件（含机架）。①求该机构的瞬心总数 K；②已知原动件 1 的角速度 ω₁=10rad/s，构件 1 上 B 点距转动中心 A 的距离 l_AB=60mm，求 B 点速度 v_B；③若构件 1 与构件 3 的相对瞬心 P₁₃ 距 B 点 40mm、距构件 3 上 C 点（C 为构件 3 的转动中心）120mm，求构件 3 的角速度 ω₃。", tag:"速度瞬心法", ans:"① K=N(N−1)/2=4×3/2=6 个瞬心。\n② v_B=ω₁·l_AB=10×0.06=0.6m/s，方向垂直于 AB。\n③ 瞬心 P₁₃ 处构件 1 与构件 3 的速度相等：v_{P13}=ω₁×0.04=10×0.04=0.4m/s；\n构件 3 上该点到其转动中心 C 的距离为 0.12m，ω₃=v_{P13}/0.12=0.4/0.12≈3.33rad/s。", exp:"瞬心法核心：两构件在瞬心处绝对速度相等（v=ω·r）。① 瞬心总数 K=N(N−1)/2；② 构件上点的速度 v=ω·r；③ 由一个构件的角速度求另一个，通过瞬心搭桥：ωᵢ·rᵢ=ωⱼ·rⱼ。三心定理用于找不直接接触构件的瞬心。"},
    {q:"牛头刨床导杆机构中，滑块 2 沿导杆 3 相对滑动，同时导杆 3 绕固定轴以 ω=4rad/s 匀速转动；某瞬时滑块相对导杆的滑动速度 v_r=2m/s。求：①该瞬时滑块上重合点的哥氏加速度 a_C 的大小与方向；②若导杆停止转动（ω=0）而 v_r 不变，哥氏加速度为多少？③说明哥氏加速度产生的条件。", tag:"哥氏加速度", ans:"① a_C=2ωv_r=2×4×2=16m/s²。方向：将相对速度 v_r 沿牵连角速度 ω 的转向（导杆转动方向）转过 90° 即为哥氏加速度方向。\n② ω=0 时 a_C=2ωv_r=0——牵连运动为移动时无哥氏加速度。\n③ 产生条件：牵连运动为转动，且相对运动为移动、相对速度方向与牵连角速度方向不平行（不共线）。", exp:"哥氏加速度 a_C=2ωv_r 只在牵连转动＋相对移动且二者不平行时出现（如牛头刨床导杆机构、摆动从动件凸轮机构）。方向判定：v_r 沿 ω 方向转 90°。若牵连运动为移动或相对运动为转动（两构件铰接重合点），则无哥氏加速度。"}
  ]},
  {id:"m10", name:"第10章 平面机构的力分析与机械效率", points:[
    {t:"运动副中的摩擦与自锁", d:"<p><span class='k'>移动副</span>：摩擦角 φ 满足 <span class='f'>tanφ = f</span>，总反力 R 与法向成 φ 角；驱动力作用线<b>位于摩擦角（摩擦锥）之内</b>时机构<b>自锁</b>。</p><p><span class='k'>转动副</span>：<span class='k'>摩擦圆</span>半径 <span class='f'>ρ = f_v·r</span>，轴颈匀速转动时轴承总反力<b>恒切于摩擦圆</b>；外力作用线<b>与摩擦圆相割</b>（切于圆内）时自锁。</p><p>螺旋副：矩形螺纹效率高用于传动，三角形螺纹摩擦力大用于联接。</p>"},
    {t:"机械效率与自锁条件", d:"<p>机械效率：<span class='f'>η = Wᵣ/W_d = 1 − W_f/W_d</span>，也等于<b>理想驱动力与实际驱动力之比</b>：η = F₀/F。</p><p>若输入功全部用于克服摩擦（<b>η = 0</b>），机械处于临界状态；<b>η ≤ 0 时机械自锁</b>，即无论驱动力多大，机械都不能运动。</p><p>注意：自锁只对<b>某个运动方向</b>而言，与驱动力大小无关。</p>"},
    {t:"机构力分析与动态静力分析", d:"<p>不考虑惯性力的力分析称为<b>静力分析</b>；按<b>达朗贝尔原理</b>把惯性力当作外力加于构件上再作静力平衡，称为<b>动态静力分析</b>。</p><p>构件惯性力与惯性力偶：<span class='f'>F_I = −ma　　M_I = −Jα</span>，可合成一个合力，作用点偏离质心。</p><p>步骤：先对<b>二力构件</b>取力平衡定反力方向，再逐杆作力多边形求运动副反力，最后求平衡力（平衡力矩）。</p>"}
  ], quiz:[
    {q:"移动副中，当驱动力作用线位于摩擦角之内时，机构将（ ）。", opts:["加速运动","匀速运动","自锁","剧烈振动"], a:2, exp:"驱动力作用线在摩擦锥内时，有效驱动力小于摩擦力，无论力多大机构都静止，即自锁。"},
    {q:"转动副中，轴颈匀速转动时，轴承对轴颈的总反力（ ）。", opts:["过轴心","恒切于摩擦圆","垂直于接触面","沿任意方向"], a:1, exp:"总反力对轴心构成阻力矩，方向恒切于摩擦圆（与相对转动方向相反）。"},
    {q:"机械自锁的条件是（ ）。", opts:["η = 1","η ≤ 0","η > 1","η = 0.5"], a:1, exp:"η≤0 时输入功全部（或不足以）克服摩擦，机械不能运动而自锁。"},
    {q:"判断题：动态静力分析是在构件上加入惯性力后进行静力平衡计算的分析方法。", opts:["正确","错误"], a:0, exp:"这是达朗贝尔原理的应用：把惯性力、惯性力偶视为外力，将动态问题转化为静力平衡问题。"},
    {q:"构件作加速运动时，其惯性力等于（ ）。", opts:["ma，方向与加速度同向","−ma，方向与加速度反向","mv²/r","mω²r"], a:1, exp:"惯性力 F_I = −ma，大小等于质量×加速度，方向与加速度方向相反。"}
  ], calc:[
    {q:"某斜面机构，滑块与斜面间摩擦系数 f=0.3，斜面的升角 λ=20°。求：①摩擦角 φ；②滑块沿斜面匀速上升时的机械效率 η；③判断该机构能否自锁（正行程）？反行程在什么条件下自锁？", tag:"机械效率与自锁", ans:"① φ=arctan f=arctan 0.3≈16.7°。\n② 斜面机构正行程（上升）效率：η=tanλ/tan(λ+φ)=tan20°/tan(20°+16.7°)=0.364/tan36.7°=0.364/0.745≈0.489≈48.9%。\n③ 正行程不自锁：λ=20°＞φ=16.7°，驱动力能克服摩擦做功；\n反行程自锁条件 λ≤φ：20°＞16.7°，不满足，故反行程也不自锁。若 λ≤16.7°，则反行程（重物下滑被卡住）自锁。", exp:"斜面机构效率：正行程 η=tanλ/tan(λ+φ)；反行程 η′=tan(λ−φ)/tanλ。自锁条件 λ≤φ（反行程自锁），λ=φ 为临界状态。螺旋副同理：η=tanλ/tan(λ+φv)，λ≤φv 时自锁。"},
    {q:"某机械传动系统由三级传动串联组成：齿轮传动 η₁=0.97、带传动 η₂=0.95、轴承（综合）η₃=0.98，输入功率 Pᵢ=10kW。求：①系统总效率 η；②输出功率 P₀；③损失的功率 ΔP；④简述提高机械传动效率的途径。", tag:"串联传动效率", ans:"① 串联机构总效率等于各级效率之积：η=η₁·η₂·η₃=0.97×0.95×0.98≈0.903≈90.3%。\n② P₀=Pᵢ·η=10×0.903≈9.03kW。\n③ ΔP=Pᵢ−P₀=10−9.03=0.97kW（转化为摩擦热散失）。\n④ 提高效率途径：减少传动级数（每级都有损耗）、按工况择优选用高效传动形式、保证良好润滑与合理装配预紧、避免不必要的功率循环与空载损耗、选用低摩擦轴承等。", exp:"串联效率相乘 η=∏ηᵢ：级数越多总效率越低，这是多级传动的固有缺点，也是传动链宜短的原因。并联时总效率按各支路功率加权平均。η 也等于理想驱动力与实际驱动力之比；η≤0 时机构自锁。"}
  ]},
  {id:"m11", name:"第11章 其他常用机构", points:[
    {t:"万向联轴节", d:"<p>用于传递两交叉轴间的运动。单万向节：当主动轴匀速转动时，<b>从动轴转速周期性地变化</b>（不等速），两轴夹角 α 越大波动越剧烈。</p><p><span class='k'>双万向节实现匀速传动的条件</span>：① 中间轴两端的叉面<b>位于同一平面内</b>；② 中间轴与主、从动轴的夹角<b>相等</b>。</p>"},
    {t:"螺旋机构", d:"<p>螺旋副将回转运动转换为直线运动（或反之）。位移：<span class='f'>s = l·φ/2π</span>（l 为导程，φ 为转角）。</p><p><span class='k'>差动螺旋</span>：两个螺旋副导程不同，位移 <span class='f'>s = (l₁−l₂)·φ/2π</span>——导程差很小时可实现<b>微动</b>。滚动螺旋（滚珠丝杠）摩擦小、效率高、磨损小，广泛用于精密机械。</p>"},
    {t:"组合机构", d:"<p>由基本机构（连杆、凸轮、齿轮、槽轮等）<b>串联、并联或封闭组合</b>而成，实现单一机构难以完成的复杂运动规律。</p><p>典型：<b>凸轮—连杆组合</b>（输出复杂轨迹）、<b>齿轮—连杆组合</b>（停歇直线运动）、<b>凸轮—齿轮组合</b>（间歇运动）。</p><p>特点：运动设计灵活，可精确实现给定轨迹或停歇，但结构较复杂、成本较高。</p>"}
  ], quiz:[
    {q:"单万向联轴节主动轴匀速转动时，从动轴的转速（ ）。", opts:["匀速不变","周期性变化","逐渐增大","逐渐减小"], a:1, exp:"单万向节从动轴转速按余弦规律周期变化，属于不等速传动。"},
    {q:"双万向节实现两轴间匀速传动的条件是（ ）。", opts:["中间轴与两轴夹角相等且两端叉面在同一平面内","两轴夹角为 0","中间轴长度任意","任意条件下都可"], a:0, exp:"两个条件缺一不可：夹角相等＋中间轴两端叉面共面。"},
    {q:"差动螺旋机构可实现（ ）。", opts:["增大导程","精确微动","自锁","增速"], a:1, exp:"两导程之差很小时，较大的转角只产生很小的位移，实现微动。"},
    {q:"将回转运动转换为直线运动的最常用机构是（ ）。", opts:["齿轮机构","凸轮机构","螺旋机构","槽轮机构"], a:2, exp:"螺旋副可将回转运动转换为直线运动，并能获得较大的传动比和力增益。"},
    {q:"判断题：组合机构是由基本机构组合而成，可实现复杂的运动规律或轨迹。", opts:["正确","错误"], a:0, exp:"通过串联、并联或封闭组合，可精确实现复杂的运动规律和轨迹。"}
  ], calc:[
    {q:"双万向联轴节实现匀速传动的条件是什么？差动螺旋机构为什么能实现精确微动？", tag:"简答", ans:"双万向节匀速传动条件：① 中间轴两端的叉面位于同一平面内；② 中间轴与主、从动轴的夹角相等（α₁=α₂）。两条件缺一不可。\n差动螺旋机构：由导程分别为 l₁、l₂ 的两段螺旋副组成，螺母位移 s=(l₁−l₂)·φ/2π。当两导程接近相等时，导程差很小，较大的输入转角只产生微小的位移，故能实现精确微动（如镗刀微调、精密工作台）。若 l₁=l₂ 且螺旋方向相同，则 s=0（可作定位机构）。", exp:"双万向节两条件：叉面共面＋夹角相等。差动螺旋微动原理：位移取决于导程差而非导程本身；注意同向螺旋 s=(l₁−l₂)φ/2π、反向螺旋 s=(l₁+l₂)φ/2π。"}
  ]},
  {id:"m12", name:"第12章 机械系统的方案设计", points:[
    {t:"机械系统的组成与设计要求", d:"<p>机械系统一般由<b>原动机（动力）、传动系统、执行系统、操纵与控制系统、支承系统</b>等组成。</p><p>设计要求：满足功能（确定性运动与力的传递）、性能好、可靠、经济、便于制造维修、环境友好。</p>"},
    {t:"方案设计的一般过程", d:"<p>① <b>明确设计任务</b>：功能要求、性能指标、约束条件；② <b>功能分析</b>：总功能分解为分功能；③ <b>原理方案</b>：用<b>形态学矩阵</b>对每个分功能列举多种解（原理/机构），组合出可行方案；④ <b>运动方案设计</b>：确定执行构件的运动形式和循环图，选择合适的机构；⑤ 结构设计与参数确定；⑥ 方案评选与决策。</p>"},
    {t:"机构的选型原则与方案评价", d:"<p>机构选型依据：<b>运动规律、动力特性、结构工艺、经济性、可靠性</b>等综合权衡，同一功能可用多种机构实现。</p><p>评价体系分<b>技术、经济、社会</b>三个方面，采用加权评分法或模糊评价进行方案对比优选。</p>"}
  ], quiz:[
    {q:"机械系统一般由原动机、传动系统、执行系统和（ ）组成。", opts:["润滑系统","操纵与控制系统","冷却系统","传感系统"], a:1, exp:"机械系统通常由原动机、传动、执行、操纵与控制系统、支承等组成。"},
    {q:"机械方案设计中，形态学矩阵主要用于（ ）。", opts:["结构强度计算","功能分解与方案组合","运动分析","预算编制"], a:1, exp:"形态学矩阵对每个分功能列举多种实现原理，组合得到多种总体方案。"},
    {q:"执行机构的选型应优先满足（ ）。", opts:["外观美观","所需的运动规律与动力要求","零件数量最少","轴系最短"], a:1, exp:"选型首先保证实现要求的运动规律和动力性能，再兼顾结构、工艺与经济性。"},
    {q:"判断题：同一机械功能一般只有一种可行的实现方案。", opts:["正确","错误"], a:1, exp:"同一功能往往有多种原理方案，方案设计就是要提出多种方案并择优。"},

const STORE = {
  get(k,d){ try{ const v=localStorage.getItem("ky_"+k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem("ky_"+k, JSON.stringify(v)); }catch(e){} }
};
let stats = STORE.get("stats", {});   // {cid.chid: {t:答过题数, c:正确数}}
let wrong = STORE.get("wrong", []);   // [{cid,chid,idx,q}]
let favs  = STORE.get("fav", []);     // [{cid,chid,pi}]
function saveAll(){ STORE.set("stats",stats); STORE.set("wrong",wrong); STORE.set("fav",favs); }

/* ================= 工具 ================= */
const $app = document.getElementById("app");
const $ttl = document.getElementById("topTitle");
const $sub = document.getElementById("topSub");
const $back = document.getElementById("backBtn");
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function allQs(cid){ const cs=COURSES[cid].chapters; const out=[]; cs.forEach((ch,ci)=>ch.quiz.forEach((q,qi)=>out.push({cid,chid:ch.id,ci,qi,q}))); return out; }
function calcAll(cid){ const cs=COURSES[cid].chapters; const out=[]; cs.forEach((ch,ci)=>(ch.calc||[]).forEach((q,qi)=>out.push({cid,chid:ch.id,ci,qi:"c"+qi,q}))); return out; }
function chById(cid,chid){ return COURSES[cid].chapters.find(c=>c.id===chid); }
function chIdx(cid,chid){ return COURSES[cid].chapters.findIndex(c=>c.id===chid); }
function chStat(cid,chid){ const s=stats[cid+"."+chid]; return s?{t:s.t,c:s.c}:{t:0,c:0}; }
function acc(st){ return st.t? Math.round(st.c/st.t*100):0; }
function courseStat(cid){ let t=0,c=0; COURSES[cid].chapters.forEach(ch=>{const s=chStat(cid,ch.id); t+=s.t; c+=s.c;}); return {t,c}; }
function allStat(){ let t=0,c=0,w=0; for(const cid in COURSES){ const s=courseStat(cid); t+=s.t; c+=s.c; } w=wrong.length; return {t,c,w}; }
function addStat(cid,chid,ok){ const k=cid+"."+chid; const s=stats[k]||{t:0,c:0}; s.t++; if(ok)s.c++; stats[k]=s; saveAll(); }
function addWrong(item){ if(!wrong.some(w=>w.cid===item.cid&&w.chid===item.chid&&w.idx===item.idx)){ wrong.push(item); saveAll(); } }
function isFav(cid,chid,pi){ return favs.some(f=>f.cid===cid&&f.chid===chid&&f.pi===pi); }
function toggleFav(cid,chid,pi){ const i=favs.findIndex(f=>f.cid===cid&&f.chid===chid&&f.pi===pi); if(i>=0)favs.splice(i,1); else favs.push({cid,chid,pi}); saveAll(); }

const QZ = {list:[], i:0, cid:null, chid:null, title:"", correct:0, answered:0, done:false, picked:-1, locked:false, src:null, selfMarked:false};
function nav(h){ location.hash = h; }
function goBack(){ history.length>1? history.back() : nav("#/"); }
window.addEventListener("hashchange", route);
function route(){
  const h = location.hash.replace(/^#\/?/,"").split("/");
  const root = h[0]||"home";
  $back.style.visibility = (root==="home")?"hidden":"visible";
  document.querySelectorAll(".tabbar .tab").forEach(t=>t.classList.toggle("on", t.dataset.tab===root||(root==="course"&&t.dataset.tab==="home")));
  if(root==="home") renderHome();
  else if(root==="course") renderCourse(h[1]);
  else if(root==="chapter") renderChapter(h[1],h[2]);
  else if(root==="quiz") renderQuiz();
  else if(root==="formula") renderFormula(h[1]);
  else if(root==="wrong") renderWrong();
  else if(root==="fav") renderFav();
  else if(root==="stats") renderStats();
  else renderHome();
}

    <h2 class="sec">各章正确率</h2>
    ${rows.length? `<div class="stat-card">${rows.join("")}</div>`:`<div class="empty"><span class="ic">📊</span>还没有做题数据，快去刷题吧</div>`}
    <div class="card"><button class="btn gray" data-act="reset">🗑️ 清空所有学习数据</button></div>`;
}

/* ================= 交互 ================= */
function startQuiz(cid,chid,src){
  let list;
  if(src==="wrong"){ list=wrong.filter(w=>w.cid===cid).map(w=>({cid:w.cid,chid:w.chid,ci:0,qi:0,q:w.q})); }
  else if(src==="calcz"){ const ch=chById(cid,chid); list=(ch.calc||[]).map((q,qi)=>({cid,chid,ci:0,qi:"c"+qi,q})); }
  else if(src==="calcall"){ list=calcAll(cid); }
  else if(chid){ const ch=chById(cid,chid); list=ch.quiz.map((q,qi)=>({cid,chid,ci:0,qi,q})); }
  else { const all=allQs(cid); list=all.sort(()=>Math.random()-.5).slice(0,15); }
  if(!list.length){ return; }
  QZ.list=list; QZ.i=0; QZ.cid=cid; QZ.chid=chid; QZ.correct=0; QZ.answered=0; QZ.done=false; QZ.picked=-1; QZ.locked=false; QZ.src=src||"quiz"; QZ.selfMarked=false;
  QZ.title = src==="wrong"?"错题重练": src==="calcz"? chById(cid,chid).name+" 真题大题" : src==="calcall"? COURSES[cid].name+" 真题大题全刷" : chid? chById(cid,chid).name+" 练习" : COURSES[cid].name+" 模拟测试";
  nav("#/quiz");
}
function renderCalcQuiz(item){
  const q=item.q;
  $ttl.textContent=QZ.title; $sub.textContent=`${QZ.i+1}/${QZ.list.length}`;
  const nextBtn = (QZ.locked&&QZ.selfMarked) ? (QZ.i+1<QZ.list.length
    ? `<button class="btn" data-act="next">下一题（${QZ.i+2}/${QZ.list.length}）</button>`
    : `<button class="btn ok" data-act="finish">查看结果</button>`) : "";
  const body = QZ.locked ? `
    <div class="card" style="margin:12px 12px 0;background:var(--okbg);border:1px solid #16a34a44">
      <div style="font-weight:700;color:var(--ok);margin-bottom:6px">✔ 参考答案</div>
      <div style="font-size:14px;line-height:1.8;white-space:pre-wrap">${esc(q.ans||"")}</div>
    </div>
    <div class="card" style="margin:12px 12px 0;background:var(--bluebg);border:1px solid #1a6dff33">
      <div style="font-weight:700;color:var(--blue);margin-bottom:6px">📝 解题过程</div>
      <div style="font-size:14px;line-height:1.8;white-space:pre-wrap">${esc(q.exp||"")}</div>
    </div>
    ${QZ.selfMarked? "" : `<div class="row" style="margin:12px 12px 0">
      <button class="btn ok" data-act="selfok">✅ 我算对了</button>
      <button class="btn" data-act="selfbad">❌ 算错了</button>
    </div>`}` : `
    <div class="card" style="margin:12px 12px 0">
      <div style="font-size:13px;color:var(--mut);margin-bottom:8px">💡 先在纸上完整作答，再对照标准解答自评。</div>
      <button class="btn ghost" data-act="reveal">📖 查看标准解答</button>
    </div>`;
  $app.innerHTML=`
    <div class="qz">
      <div class="prog">
        <div class="pbar"><i style="width:${(QZ.i+1)/QZ.list.length*100}%"></i></div>
        <div class="num">${QZ.i+1}/${QZ.list.length}</div>
      </div>
      <div class="card" style="margin:12px 12px 0;background:#fffbe9;border:1px solid #f59e0b55">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px"><span class="pill orange">真题大题</span><span style="font-size:12px;color:var(--mut)">${esc(q.tag||"计算/分析题")}</span></div>
        <div class="stem" style="white-space:pre-wrap">${QZ.i+1}. ${esc(q.q)}</div>
      </div>
      ${body}
      <div style="margin:14px 12px 0">${nextBtn}</div>
    </div>
    <p class="tip">${QZ.src==="wrong"?"来源：错题本重练":"对照解答后自评对错 · 错题自动进入错题本"} · 对 ${QZ.correct} 错 ${QZ.answered-QZ.correct}</p>`;
}
function revealAns(){
  if(QZ.locked) return;
  QZ.locked=true; QZ.answered++; QZ.selfMarked=false;
  renderQuiz();
}
function selfMark(ok){
  if(!QZ.locked||QZ.selfMarked) return;
  QZ.selfMarked=true;
  const item=QZ.list[QZ.i]; const stamped={...item.q};
  if(ok){ QZ.correct++; } else { addWrong({cid:item.cid,chid:item.chid,idx:item.qi,q:stamped}); }
  addStat(item.cid,item.chid,ok);
  renderQuiz();
}
function pick(oi){
  if(QZ.locked) return;
  QZ.picked=oi; QZ.locked=true; QZ.answered++;
  const item=QZ.list[QZ.i]; const ok=oi===item.q.a;
  if(ok){ QZ.correct++; } else { addWrong({cid:item.cid,chid:item.chid,idx:item.qi,q:item.q}); }
  addStat(item.cid,item.chid,ok);
  renderQuiz();
}
function nextQ(){ QZ.i++; QZ.picked=-1; QZ.locked=false; QZ.selfMarked=false; renderQuiz(); }
function finish(){
  QZ.done=true;
  const c=COURSES[QZ.cid];
  const pct=QZ.list.length?Math.round(QZ.correct/QZ.list.length*100):0;
  const color=pct>=80?"var(--ok)":pct>=60?"var(--orange)":"var(--bad)";
  $ttl.textContent="练习结果"; $sub.textContent="";
  $app.innerHTML=`
    <div class="card res-card">
      <div class="score">${QZ.correct}<small> / ${QZ.list.length}</small></div>
      <div class="ring" style="background:${color}">${pct}%</div>
      <div style="font-size:15px;font-weight:600;margin-bottom:4px">${pct>=80?"🎉 掌握得很好！":pct>=60?"👍 继续加油！":"📖 建议回看知识卡片再练"}</div>
      <div style="font-size:13px;color:var(--mut);margin-bottom:16px">${QZ.title} · 答对 ${QZ.correct} 题，答错 ${QZ.answered-QZ.correct} 题（错题已入错题本）</div>
      <div class="row">
        <button class="btn ghost" data-act="restart">↻ 再练一次</button>
        <button class="btn" data-act="home">完成</button>
      </div>
    </div>`;
}
function resetAll(){
  if(!confirm("确定清空所有做题记录、错题本和收藏吗？")) return;
  stats={}; wrong=[]; favs=[]; saveAll(); route();
}

/* ================= 事件委托 ================= */
document.addEventListener("click", e=>{
  const t=e.target.closest("[data-act]");
  if(!t) return;
  const act=t.dataset.act;
  if(act==="home") nav("#/");
  else if(act==="course") nav("#/course/"+t.dataset.cid);
  else if(act==="chapter") nav("#/chapter/"+t.dataset.cid+"/"+t.dataset.chid);
  else if(act==="formula") nav("#/formula/"+t.dataset.cid);
  else if(act==="exam") startQuiz(t.dataset.cid,null,"exam");
  else if(act==="quiz") startQuiz(t.dataset.cid,t.dataset.chid,"quiz");
  else if(act==="calcz") startQuiz(t.dataset.cid,t.dataset.chid,"calcz");
  else if(act==="calcall") startQuiz(t.dataset.cid,null,"calcall");
  else if(act==="pick") pick(+t.dataset.oi);
  else if(act==="reveal") revealAns();
  else if(act==="selfok") selfMark(true);
  else if(act==="selfbad") selfMark(false);
  else if(act==="next") nextQ();
  else if(act==="finish") finish();
  else if(act==="restart"){ const {cid,chid,src}=QZ; startQuiz(cid,chid,src); }
  else if(act==="fav"){ toggleFav(t.dataset.cid,t.dataset.chid,+t.dataset.pi); renderChapter(t.dataset.cid,t.dataset.chid); }
  else if(act==="rmfav"){ favs.splice(+t.dataset.i,1); saveAll(); renderFav(); }
  else if(act==="rmwrong"){ wrong.splice(+t.dataset.i,1); saveAll(); renderWrong(); }
  else if(act==="redo") startQuiz(t.dataset.cid,null,"wrong");
  else if(act==="goch") nav("#/chapter/"+t.dataset.cid+"/"+t.dataset.chid);
  else if(act==="reset") resetAll();
});
document.querySelectorAll(".tabbar .tab").forEach(tab=>{
  tab.addEventListener("click", ()=>nav("#/"+tab.dataset.tab));
});
$back.addEventListener("click", goBack);

/* ================= 启动 ================= */
route();
</script>
</body>
</html>
